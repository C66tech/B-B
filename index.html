    <script>
        // --- GAME CONSTANTS & CONFIGURATION ---
        const GAME_TITLE = "ARkanium";
        const VERSION = "v3.6.0";
        const MAX_LEVELS = 10;
        const INITIAL_PRNG_SEED = 20260906;

        function showToast(message, iconClass = "fa-circle-info") {
            const container = document.getElementById('toast-container');
            const bodyMessage = document.getElementById('toast-message');
            const icon = document.getElementById('toast-icon');

            if (!container || !bodyMessage) return;

            bodyMessage.textContent = message;
            icon.className = `fa-solid ${iconClass} text-cyan-400`;

            container.classList.remove('opacity-0', '-translate-y-4');
            container.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                container.classList.remove('opacity-100', 'translate-y-0');
                container.classList.add('opacity-0', '-translate-y-4');
            }, 3200);
        }

        class SeededPRNG {
            constructor(seed = INITIAL_PRNG_SEED) {
                this.seed = seed;
            }

            reset(seed = INITIAL_PRNG_SEED) {
                this.seed = seed;
            }

            next() {
                let t = this.seed += 0x6D2B79F5;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }
        }

        class RetroAudioEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type = 'square', duration = 0.08, volume = 0.15) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }

            playArpeggioNote(step) {
                if (this.muted || !this.ctx) return;
                // 8-note arpeggio loop: 4 notes ascending (C3, E3, G3, C4), 4 notes descending (B3, G3, E3, D3)
                const freqs = [130.81, 164.81, 196.00, 261.63, 246.94, 196.00, 164.81, 146.83];
                this.playTone(freqs[step % 8], 'sawtooth', 0.065, 0.18);
            }

            paddleHit() { this.playTone(320, 'triangle', 0.09, 0.22); }
            wallHit() { this.playTone(210, 'sine', 0.06, 0.14); }
            
            gunshot() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc1 = this.ctx.createOscillator();
                    const gain1 = this.ctx.createGain();
                    osc1.type = 'sawtooth';
                    osc1.frequency.setValueAtTime(850, now);
                    osc1.frequency.exponentialRampToValueAtTime(35, now + 0.08);
                    gain1.gain.setValueAtTime(0.40, now);
                    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc1.connect(gain1);
                    gain1.connect(this.ctx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.08);
                } catch (e) {}
            }

            explosion() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } catch (e) {}
            }

            shieldHit() { this.playTone(620, 'sine', 0.2, 0.3); }
            speedBoost() { this.playTone(880, 'sine', 0.12, 0.2); }
            powerUpPickup() {
                [523, 659, 783, 1046].forEach((f, idx) => {
                    setTimeout(() => this.playTone(f, 'sine', 0.1, 0.2), idx * 60);
                });
            }
            laserShot() { this.playTone(950, 'sawtooth', 0.04, 0.18); }
            levelUp() {
                [523, 659, 783, 1046].forEach((f, idx) => {
                    setTimeout(() => this.playTone(f, 'sine', 0.15, 0.22), idx * 100);
                });
            }
            uiClick() { this.playTone(780, 'sine', 0.05, 0.18); }
            lifeLost() { 
                this.playTone(180, 'sawtooth', 0.2, 0.25);
                setTimeout(() => this.playTone(120, 'sawtooth', 0.3, 0.25), 180);
            }
            gameOver() {
                [220, 196, 174, 130].forEach((f, idx) => {
                    setTimeout(() => this.playTone(f, 'sawtooth', 0.25, 0.3), idx * 200);
                });
            }
            gameWin() {
                [523, 659, 783, 1046, 1318].forEach((f, idx) => {
                    setTimeout(() => this.playTone(f, 'sine', 0.18, 0.25), idx * 120);
                });
            }
            countdownTick() { this.playTone(600, 'sine', 0.08, 0.2); }
            countdownGo() { this.playTone(1200, 'sine', 0.65, 0.30); }
        }

        const audio = new RetroAudioEngine();

        const BRICK_W = 0.12;
        const BRICK_H = 0.06;
        const BRICK_D = 0.06;
        const BRICKS_COLS = 13;
        const GAP_X = 0.01;

        const FIELD = {
            width: 1.76,      
            height: 2.10,     
            depth: 0.10,      
            bottomY: 0.25,    
            get centerY() { return this.bottomY + (this.height / 2); }, 
            get topY() { return this.bottomY + this.height; },         
            zPos: -1.80       
        };

        const ROW_COLORS = [0xff2a55, 0xff00d4, 0xffea00, 0x00d8ff, 0x00ff88, 0x9900ff];

        class QuestPyrotechnicParticlePool {
            constructor(parentGroup, maxParticles = 400) {
                this.parentGroup = parentGroup;
                this.pool = [];
                this.sharedGeo = new THREE.BoxGeometry(0.022, 0.022, 0.022);

                for (let i = 0; i < maxParticles; i++) {
                    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1.0 });
                    const pMesh = new THREE.Mesh(this.sharedGeo, mat);
                    pMesh.visible = false;
                    this.parentGroup.add(pMesh);

                    this.pool.push({
                        mesh: pMesh,
                        mat: mat,
                        velocity: new THREE.Vector3(),
                        rotVelocity: new THREE.Vector3(),
                        life: 0,
                        maxLife: 0.45,
                        active: false
                    });
                }
            }

            explode(position, colorHex) {
                const count = 22;
                let spawned = 0;

                for (let i = 0; i < this.pool.length && spawned < count; i++) {
                    const p = this.pool[i];
                    if (!p.active) {
                        p.active = true;
                        p.mesh.visible = true;
                        p.mesh.position.copy(position);

                        const isSpark = Math.random() < 0.25;
                        p.mat.color.setHex(isSpark ? (Math.random() < 0.5 ? 0xffffff : 0xffea00) : colorHex);
                        p.mat.opacity = 1.0;
                        
                        const duration = 0.30 + Math.random() * 0.25;
                        p.life = duration;
                        p.maxLife = duration;

                        p.velocity.set(
                            (Math.random() - 0.5) * 3.6,
                            (Math.random() - 0.2) * 3.4,
                            (Math.random() - 0.5) * 2.2
                        );

                        p.rotVelocity.set(
                            (Math.random() - 0.5) * 12.0,
                            (Math.random() - 0.5) * 12.0,
                            (Math.random() - 0.5) * 12.0
                        );

                        spawned++;
                    }
                }
            }

            update(dt) {
                for (let i = 0; i < this.pool.length; i++) {
                    const p = this.pool[i];
                    if (!p.active) continue;

                    p.life -= dt;
                    if (p.life <= 0) {
                        p.active = false;
                        p.mesh.visible = false;
                    } else {
                        p.mesh.position.addScaledVector(p.velocity, dt);
                        p.mesh.rotation.x += p.rotVelocity.x * dt;
                        p.mesh.rotation.y += p.rotVelocity.y * dt;
                        p.mesh.rotation.z += p.rotVelocity.z * dt;

                        p.velocity.y -= 5.0 * dt;

                        const progress = p.life / p.maxLife;
                        p.mesh.scale.setScalar(Math.max(0.01, progress * 1.2));
                        p.mat.opacity = progress;
                    }
                }
            }
        }

        class ARkaniumXRApp {
            constructor() {
                this.container = document.getElementById('webgl-container');
                this.prng = new SeededPRNG(INITIAL_PRNG_SEED);

                this.gameState = 'LOBBY'; 
                this.level = 1;
                this.score = 0;
                this.lives = 3;
                this.baseBallSpeed = 1.8;
                this.speedMultiplier = 1.0;
                this.totalBricksHitInLife = 0;
                this.paddleWidth = 0.38 * 0.90; 
                this.paddleX = 0;

                this.fieldScale = 1.0;
                this.fieldPosY = 0.0;

                this.isLevelTransitioning = false;

                this.isCountdownActive = false;
                this.countdownTimer = null;

                // 8-Note Audio Arpeggio Loop State
                this.arpeggioTimer = 0;
                this.arpeggioStep = 0;
                this.arpeggioBaseInterval = 0.32;

                // Power-up Cumulative States
                this.isFireActive = false;
                this.fireTimer = 0;
                this.isExplosiveActive = false;
                this.explosiveTimer = 0;
                this.hasBarrier = false;
                this.barrierTimer = 0;

                this.balls = [];
                this.activePowerUps = [];
                this.bullets = [];

                this.controlMode = 'RAY';
                this.activeHand = 'RIGHT';
                this.paddleSensitivity = 2.0;

                this.showLasersInGame = false;
                this.prevButtonBState = false;

                // Multi-HUD Dragging State
                this.isDraggingHUD = false;
                this.hudDragController = null;
                this.hudDragTargetGroup = null;
                this.hudDragOffsetXZ = new THREE.Vector2();

                this.interactiveObjects = [];

                this.raycaster = new THREE.Raycaster();
                this.tempMatrix = new THREE.Matrix4();
                this.playfieldPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -FIELD.zPos);
                this.rayOrigin = new THREE.Vector3();
                this.rayDir = new THREE.Vector3();
                this.targetPoint = new THREE.Vector3();

                this.initScene();
                this.initLighting();
                this.initField();
                this.initPaddleAndBall();
                this.initLobbyPanel();
                this.initGameOverPanel();
                this.initDebugHUD();
                this.initBonusLegendHUD();
                this.particlePool = new QuestPyrotechnicParticlePool(this.fieldGroup);
                this.initXRControllers();
                this.initWebXRLauncher();

                this.renderer.setAnimationLoop((time, frame) => this.render(time, frame));
            }

            initScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x04070d);
                this.camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 50);
                this.camera.position.set(0, 1.6, 0.8);
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.xr.enabled = true;
                this.renderer.xr.setReferenceSpaceType('local-floor');
                this.container.appendChild(this.renderer.domElement);

                this.floorGrid = new THREE.GridHelper(20, 40, 0x00f0ff, 0x1e293b);
                this.floorGrid.position.set(0, 0, -2);
                this.scene.add(this.floorGrid);
            }

            initLighting() {
                const ambient = new THREE.AmbientLight(0xffffff, 0.7);
                this.scene.add(ambient);
                const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.2);
                dirLight.position.set(2, 4, 2);
                this.scene.add(dirLight);
                const pointLight = new THREE.PointLight(0xff00d4, 1.5, 8);
                pointLight.position.set(0, 2.0, -2.5);
                this.scene.add(pointLight);
            }

            initField() {
                this.fieldGroup = new THREE.Group();
                this.fieldGroup.position.set(0, this.fieldPosY, FIELD.zPos);
                this.fieldGroup.scale.setScalar(this.fieldScale);

                const frameGeo = new THREE.BoxGeometry(FIELD.width, FIELD.height, FIELD.depth);
                const edges = new THREE.EdgesGeometry(frameGeo);
                const lineMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2 });
                const frameMesh = new THREE.LineSegments(edges, lineMat);
                frameMesh.position.set(0, FIELD.centerY, 0);
                this.fieldGroup.add(frameMesh);

                const backGeo = new THREE.PlaneGeometry(FIELD.width, FIELD.height);
                const backMat = new THREE.MeshBasicMaterial({ color: 0x060a17, transparent: true, opacity: 0.85 });
                const backPlane = new THREE.Mesh(backGeo, backMat);
                backPlane.position.set(0, FIELD.centerY, -FIELD.depth / 2);
                this.fieldGroup.add(backPlane);

                const hazardGeo = new THREE.BoxGeometry(FIELD.width, 0.02, FIELD.depth);
                this.hazardMat = new THREE.MeshStandardMaterial({ color: 0x0066ff, emissive: 0x0066ff, emissiveIntensity: 0.8 });
                this.hazardBar = new THREE.Mesh(hazardGeo, this.hazardMat);
                this.hazardBar.position.set(0, FIELD.bottomY, 0);
                this.fieldGroup.add(this.hazardBar);

                this.bricksGroup = new THREE.Group();
                this.fieldGroup.add(this.bricksGroup);
                this.scene.add(this.fieldGroup);
            }

            setHazardBarState(isBarrierActive) {
                if (isBarrierActive) {
                    this.hazardMat.color.setHex(0xff00ff);
                    this.hazardMat.emissive.setHex(0xff00ff);
                } else {
                    this.hazardMat.color.setHex(0x0066ff);
                    this.hazardMat.emissive.setHex(0x0066ff);
                }
            }

            getRemainingBricksCount() {
                let count = 0;
                if (!this.bricksGroup) return 0;
                for (let i = 0; i < this.bricksGroup.children.length; i++) {
                    const b = this.bricksGroup.children[i];
                    if (b && b.visible && b.userData && b.userData.active) {
                        count++;
                    }
                }
                return count;
            }

            buildBricksForLevel(levelNum) {
                while (this.bricksGroup.children.length > 0) {
                    const b = this.bricksGroup.children[0];
                    this.bricksGroup.remove(b);
                    b.traverse((child) => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                            else child.material.dispose();
                        }
                    });
                }

                const rows = 3 + Math.floor(levelNum / 2);
                const brickW = BRICK_W;
                const brickH = BRICK_H;
                const brickD = BRICK_D;
                const totalBricksW = (BRICKS_COLS * brickW) + ((BRICKS_COLS - 1) * GAP_X);
                const startX = -totalBricksW / 2 + brickW / 2;
                const startY = FIELD.topY - 0.18;

                const pairsToRemove = Math.min(levelNum, Math.floor((rows * (BRICKS_COLS - 1)) / 2));
                const allPairs = [];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < Math.floor(BRICKS_COLS / 2); c++) {
                        allPairs.push({ r, c });
                    }
                }

                for (let i = allPairs.length - 1; i > 0; i--) {
                    const j = Math.floor(this.prng.next() * (i + 1));
                    const temp = allPairs[i]; allPairs[i] = allPairs[j]; allPairs[j] = temp;
                }

                const removedSet = new Set();
                for (let i = 0; i < pairsToRemove && i < allPairs.length; i++) {
                    const pair = allPairs[i];
                    removedSet.add(`${pair.r}_${pair.c}`);
                    removedSet.add(`${pair.r}_${BRICKS_COLS - 1 - pair.c}`);
                }

                const createdBricks = [];

                for (let r = 0; r < rows; r++) {
                    const colorHex = ROW_COLORS[r % ROW_COLORS.length];
                    const y = startY - r * (brickH + 0.012);

                    for (let c = 0; c < BRICKS_COLS; c++) {
                        if (removedSet.has(`${r}_${c}`)) continue;

                        const x = startX + c * (brickW + GAP_X);
                        const geo = new THREE.BoxGeometry(brickW, brickH, brickD);
                        const mat = new THREE.MeshStandardMaterial({
                            color: colorHex, emissive: colorHex,
                            emissiveIntensity: 0.35, roughness: 0.3, metalness: 0.5
                        });

                        const mesh = new THREE.Mesh(geo, mat);
                        mesh.position.set(x, y, 0);

                        const edgeMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
                        mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));

                        mesh.userData = {
                            active: true, row: r, col: c, colorHex: colorHex,
                            points: (rows - r) * 10,
                            hasBonus: null
                        };
                        this.bricksGroup.add(mesh);
                        createdBricks.push(mesh);
                    }
                }

                const numBonuses = 3 + Math.floor(levelNum / 2);
                const availableIndices = createdBricks.map((_, idx) => idx);

                for (let i = availableIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(this.prng.next() * (i + 1));
                    const temp = availableIndices[i]; availableIndices[i] = availableIndices[j]; availableIndices[j] = temp;
                }

                const countToAssign = Math.min(numBonuses, createdBricks.length);
                for (let i = 0; i < countToAssign; i++) {
                    const targetBrick = createdBricks[availableIndices[i]];
                    const roll = this.prng.next();
                    let bonusType = 'F';

                    if (roll < 0.10) bonusType = 'L';       // Extra Life
                    else if (roll < 0.22) bonusType = '$';  // +300 Cash Bonus
                    else if (roll < 0.36) bonusType = 'M';  // Multi-Ball
                    else if (roll < 0.50) bonusType = 'X';  // Explosive Ball
                    else if (roll < 0.64) bonusType = 'B';  // Barrier Shield
                    else if (roll < 0.78) bonusType = 'S';  // Speed Slow
                    else bonusType = 'F';                   // Fire Mode

                    targetBrick.userData.hasBonus = bonusType;
                }
            }

            initPaddleAndBall() {
                const pGeo = new THREE.BoxGeometry(this.paddleWidth, 0.06, FIELD.depth);
                this.paddleMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff, emissive: 0x333333,
                    metalness: 0.8, roughness: 0.2
                });
                this.paddleMesh = new THREE.Mesh(pGeo, this.paddleMat);
                this.paddleMesh.position.set(0, FIELD.bottomY + 0.15, 0);
                this.fieldGroup.add(this.paddleMesh);

                this.ballSide = 0.06;
                this.sharedBallGeo = new THREE.BoxGeometry(this.ballSide, this.ballSide, this.ballSide);
                this.resetBallAndPaddle();
            }

            createBallInstance(x, y, velX = 0, velY = 0) {
                const bMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff, emissive: this.isExplosiveActive ? 0xff0000 : 0x00f0ff,
                    emissiveIntensity: 0.9, roughness: 0.1
                });
                const mesh = new THREE.Mesh(this.sharedBallGeo, bMat);
                mesh.position.set(x, y, 0);

                const light = new THREE.PointLight(this.isExplosiveActive ? 0xff0000 : 0x00ffff, 1.5, 1.5);
                mesh.add(light);
                this.fieldGroup.add(mesh);

                return { mesh, vel: new THREE.Vector3(velX, velY, 0) };
            }

            updatePaddleVisuals(latestType) {
                if (latestType === 'FIRE') {
                    this.paddleMat.color.setHex(0xff6600);
                    this.paddleMat.emissive.setHex(0x993300);
                } else if (latestType === 'SPEED') {
                    this.paddleMat.color.setHex(0x00f0ff);
                    this.paddleMat.emissive.setHex(0x0077aa);
                } else if (latestType === 'LIFE') {
                    this.paddleMat.color.setHex(0x00ff88);
                    this.paddleMat.emissive.setHex(0x008844);
                } else if (latestType === 'EXPLOSIVE') {
                    this.paddleMat.color.setHex(0xff0000);
                    this.paddleMat.emissive.setHex(0x990000);
                } else if (latestType === 'BARRIER') {
                    this.paddleMat.color.setHex(0xff007f);
                    this.paddleMat.emissive.setHex(0x99004c);
                }
            }

            refreshPaddleVisuals() {
                if (this.isFireActive) this.updatePaddleVisuals('FIRE');
                else if (this.isExplosiveActive) this.updatePaddleVisuals('EXPLOSIVE');
                else if (this.hasBarrier) this.updatePaddleVisuals('BARRIER');
                else {
                    this.paddleMat.color.setHex(0xffffff);
                    this.paddleMat.emissive.setHex(0x333333);
                }
            }

            spawnPowerUp(position, type) {
                if (!type) return;

                const c = document.createElement('canvas');
                c.width = 128; c.height = 128;
                const ctx = c.getContext('2d');

                let colorHex = '#ff6600';
                if (type === 'F') colorHex = '#ff6600';
                else if (type === '$') colorHex = '#ffea00';
                else if (type === 'X') colorHex = '#ff0000';
                else if (type === 'B') colorHex = '#ff007f';
                else if (type === 'S') colorHex = '#00f0ff';
                else if (type === 'L') colorHex = '#00ff88';
                else if (type === 'M') colorHex = '#a855f7';

                ctx.fillStyle = colorHex; ctx.fillRect(0, 0, 128, 128);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, 118, 118);
                ctx.fillStyle = (type === '$') ? '#000000' : '#ffffff'; 
                ctx.font = 'bold 85px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(type, 64, 64);

                const tex = new THREE.CanvasTexture(c);
                const geo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
                const mat = new THREE.MeshStandardMaterial({ map: tex, emissive: new THREE.Color(colorHex), emissiveIntensity: 0.6 });

                const pMesh = new THREE.Mesh(geo, mat);
                pMesh.position.copy(position);
                pMesh.userData = { type: type };

                this.fieldGroup.add(pMesh);
                this.activePowerUps.push(pMesh);
            }

            shootDoubleLasers() {
                if (!this.isFireActive || this.fireTimer <= 0) return;

                const halfW = this.paddleWidth / 2 - 0.02;
                const barrelY = this.paddleMesh.position.y + 0.04;
                const leftX = this.paddleMesh.position.x - halfW;
                const rightX = this.paddleMesh.position.x + halfW;

                [leftX, rightX].forEach((xPos) => {
                    const geo = new THREE.CylinderGeometry(0.008, 0.008, 0.08);
                    const mat = new THREE.MeshBasicMaterial({ color: 0xff6600 });
                    const bullet = new THREE.Mesh(geo, mat);
                    bullet.position.set(xPos, barrelY, 0);
                    this.fieldGroup.add(bullet);
                    this.bullets.push(bullet);
                });

                audio.laserShot();
            }

            triggerAreaExplosion(centerPos) {
                audio.explosion();
                const radius = 0.22;
                const bricks = this.bricksGroup.children;

                for (let j = bricks.length - 1; j >= 0; j--) {
                    const b = bricks[j];
                    if (!b || !b.visible || !b.userData || !b.userData.active) continue;

                    const dist = b.position.distanceTo(centerPos);
                    if (dist <= radius) {
                        b.userData.active = false;
                        b.visible = false;
                        this.particlePool.explode(b.position, b.userData.colorHex);

                        if (b.userData.hasBonus) {
                            this.spawnPowerUp(b.position, b.userData.hasBonus);
                        }

                        this.bricksGroup.remove(b);
                        if (b.geometry) b.geometry.dispose();
                        if (b.material) b.material.dispose();
                        this.score += b.userData.points;
                    }
                }
            }

            startLevelCountdown(onComplete) {
                if (this.countdownTimer) clearInterval(this.countdownTimer);
                this.isCountdownActive = true;
                let count = 3;
                audio.countdownTick();

                this.countdownTimer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        audio.countdownTick();
                    } else if (count === 0) {
                        audio.countdownGo();
                    } else {
                        clearInterval(this.countdownTimer);
                        this.countdownTimer = null;
                        this.isCountdownActive = false;
                        if (onComplete) onComplete();
                    }
                }, 1000);
            }

            clearPowerUpsAndBullets() {
                this.activePowerUps.forEach(p => {
                    this.fieldGroup.remove(p);
                    p.geometry.dispose(); p.material.dispose();
                });
                this.activePowerUps = [];

                this.bullets.forEach(b => {
                    this.fieldGroup.remove(b);
                    b.geometry.dispose(); b.material.dispose();
                });
                this.bullets = [];

                this.balls.forEach(b => {
                    this.fieldGroup.remove(b.mesh);
                    b.mesh.traverse(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) child.material.dispose();
                    });
                });
                this.balls = [];

                this.fireTimer = 0;
                this.isFireActive = false;
                this.explosiveTimer = 0;
                this.isExplosiveActive = false;
                this.hasBarrier = false;
                this.barrierTimer = 0;
                this.setHazardBarState(false);
                this.refreshPaddleVisuals();
            }

            resetBallAndPaddle() {
                this.paddleX = 0;
                this.paddleMesh.position.x = 0;
                this.clearPowerUpsAndBullets();

                const mainBall = this.createBallInstance(0, FIELD.bottomY + 0.30, 0, 0);
                this.balls.push(mainBall);
            }

            launchBall() {
                if (this.balls.length > 0) {
                    const currentSpeed = this.baseBallSpeed * this.speedMultiplier;
                    const angle = (Math.random() * 0.4 - 0.2);
                    this.balls[0].vel.set(Math.sin(angle) * currentSpeed, currentSpeed, 0);
                }
            }

            }

            initWebXRLauncher() {
                const btnVR = document.getElementById('btn-vr');
                const btnAR = document.getElementById('btn-ar');
                if (!navigator.xr) {
                    showToast('WebXR not supported. Use a compatible VR/AR headset.', 'fa-triangle-exclamation'); return;
                }
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported && btnVR) btnVR.addEventListener('click', () => this.requestXRSession('immersive-vr'));
                });
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported && btnAR) btnAR.addEventListener('click', () => this.requestXRSession('immersive-ar'));
                });
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            async requestXRSession(mode) {
                audio.init();
                try {
                    const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
                    const session = await navigator.xr.requestSession(mode, sessionInit);
                    this.renderer.xr.setSession(session);
                    if (mode === 'immersive-ar') {
                        this.scene.background = null; this.floorGrid.visible = false; this.renderer.setClearColor(0x000000, 0);
                    } else {
                        this.scene.background = new THREE.Color(0x04070d); this.floorGrid.visible = true; this.renderer.setClearColor(0x04070d, 1);
                    }
                    session.addEventListener('end', () => {
                        this.scene.background = new THREE.Color(0x04070d); this.floorGrid.visible = true; this.renderHUDCanvas();
                    });
                    showToast(`${mode.toUpperCase()} Session Started!`, 'fa-circle-check');
                } catch (err) {
                    console.error('WebXR session error:', err);
                    showToast(`Unable to start ${mode.toUpperCase()} session`, 'fa-triangle-exclamation');
                }
            }

            onXRSelectStart(event) {
                audio.init();
                const controller = event.target;
                this.tempMatrix.identity().extractRotation(controller.matrixWorld);
                this.raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                this.raycaster.ray.direction.set(0, 0, -1).applyMatrix4(this.tempMatrix);

                const intersects = this.raycaster.intersectObjects(this.interactiveObjects, true);
                if (intersects.length > 0) {
                    let hitObj = intersects[0].object;
                    while (hitObj && !hitObj.userData.action && hitObj.parent) hitObj = hitObj.parent;
                    if (hitObj && hitObj.userData.action) {
                        audio.uiClick(); this.handleAction(hitObj.userData.action); return;
                    }
                }

                if (this.gameState === 'PLAYING' && !this.isCountdownActive && this.isFireActive && !this.isLevelTransitioning) {
                    this.shootDoubleLasers();
                }
            }

            onXRSqueezeStart(event) {
                const controller = event.target;
                this.tempMatrix.identity().extractRotation(controller.matrixWorld);
                this.raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                this.raycaster.ray.direction.set(0, 0, -1).applyMatrix4(this.tempMatrix);

                const intersectsLeft = this.raycaster.intersectObject(this.hudMesh, true);
                const intersectsRight = this.raycaster.intersectObject(this.rightHudMesh, true);

                let targetGroup = null;
                if (intersectsLeft.length > 0) targetGroup = this.hudGroup;
                else if (intersectsRight.length > 0) targetGroup = this.rightHudGroup;

                if (targetGroup) {
                    this.isDraggingHUD = true;
                    this.hudDragController = controller;
                    this.hudDragTargetGroup = targetGroup;
                    const ctrlPos = new THREE.Vector3();
                    controller.matrixWorld.decompose(ctrlPos, new THREE.Quaternion(), new THREE.Vector3());

                    this.hudDragOffsetXZ.set(
                        targetGroup.position.x - ctrlPos.x,
                        targetGroup.position.z - ctrlPos.z
                    );
                    showToast('HUD Dragging Active (XZ Plane)', 'fa-hand-rock');
                }
            }

            onXRSqueezeEnd(event) {
                if (this.isDraggingHUD && event.target === this.hudDragController) {
                    this.isDraggingHUD = false;
                    this.hudDragController = null;
                    this.hudDragTargetGroup = null;
                    showToast('HUD Repositioned', 'fa-location-dot');
                }
            }

            toggleLaserRays() {
                this.showLasersInGame = !this.showLasersInGame;
                this.renderHUDCanvas();
                showToast(`In-Game Lasers: ${this.showLasersInGame ? 'ON' : 'OFF'}`, 'fa-bolt');
            }

            updateButtonLabels() {
                if (this.btnToggleMode) {
                    const labelMesh = this.btnToggleMode.children[0];
                    if (labelMesh) {
                        const c = labelMesh.material.map.image; const cCtx = c.getContext('2d');
                        cCtx.fillStyle = '#0f172a'; cCtx.fillRect(0, 0, c.width, c.height);
                        cCtx.strokeStyle = '#00f0ff'; cCtx.lineWidth = 6; cCtx.strokeRect(4, 4, c.width-8, c.height-8);
                        cCtx.fillStyle = '#ffffff'; cCtx.font = 'bold 36px sans-serif'; cCtx.textAlign = 'center'; cCtx.textBaseline = 'middle';
                        cCtx.fillText(this.controlMode === 'RAY' ? 'MODE: RAY' : 'MODE: TILT', c.width / 2, c.height / 2);
                        labelMesh.material.map.needsUpdate = true;
                    }
                }
                if (this.btnToggleHand) {
                    const labelMesh = this.btnToggleHand.children[0];
                    if (labelMesh) {
                        const c = labelMesh.material.map.image; const cCtx = c.getContext('2d');
                        cCtx.fillStyle = '#0f172a'; cCtx.fillRect(0, 0, c.width, c.height);
                        cCtx.strokeStyle = '#00f0ff'; cCtx.lineWidth = 6; cCtx.strokeRect(4, 4, c.width-8, c.height-8);
                        cCtx.fillStyle = '#ffffff'; cCtx.font = 'bold 36px sans-serif'; cCtx.textAlign = 'center'; cCtx.textBaseline = 'middle';
                        cCtx.fillText(`HAND: ${this.activeHand}`, c.width / 2, c.height / 2);
                        labelMesh.material.map.needsUpdate = true;
                    }
                }
            }

            handleAction(action) {
                if (action === 'START_GAME') this.startGame();
                else if (action === 'EXIT_GAME') { this.returnToLobby(); showToast('Returned to Lobby', 'fa-house'); }
                else if (action === 'TOGGLE_MODE') { this.controlMode = this.controlMode === 'RAY' ? 'TILT' : 'RAY'; this.updateButtonLabels(); this.renderHUDCanvas(); showToast(`Control Mode: ${this.controlMode === 'RAY' ? 'RAY 1:1' : 'TILT'}`, 'fa-sliders'); }
                else if (action === 'TOGGLE_HAND') { this.activeHand = this.activeHand === 'RIGHT' ? 'LEFT' : 'RIGHT'; this.updateButtonLabels(); this.renderHUDCanvas(); showToast(`Active Hand: ${this.activeHand}`, 'fa-hand'); }
                else if (action === 'SENS_DOWN') { this.paddleSensitivity = Math.max(1.0, this.paddleSensitivity - 0.5); this.renderHUDCanvas(); showToast(`TILT Sensitivity: ${this.paddleSensitivity.toFixed(1)}x`, 'fa-sliders'); }
                else if (action === 'SENS_UP') { this.paddleSensitivity = Math.min(4.0, this.paddleSensitivity + 0.5); this.renderHUDCanvas(); showToast(`TILT Sensitivity: ${this.paddleSensitivity.toFixed(1)}x`, 'fa-sliders'); }
            }

            startGame() {
                this.prng.reset(INITIAL_PRNG_SEED);
                this.gameState = 'PLAYING';
                this.level = 1; this.score = 0; this.lives = 3; this.speedMultiplier = 1.0; this.totalBricksHitInLife = 0;
                this.showLasersInGame = false;
                this.isLevelTransitioning = false;
                this.arpeggioTimer = 0;
                this.arpeggioStep = 0;
                this.lobbyGroup.visible = false;
                this.gameOverGroup.visible = false;

                this.buildBricksForLevel(this.level);
                this.resetBallAndPaddle();
                this.renderHUDCanvas();
                this.startLevelCountdown(() => { this.launchBall(); });
            }

            advanceLevel() {
                if (this.isLevelTransitioning) return;
                this.isLevelTransitioning = true;

                this.level++;
                if (this.level > MAX_LEVELS) {
                    this.gameState = 'VICTORY'; audio.gameWin();
                    showToast('VICTORY! All 10 levels completed!', 'fa-trophy');
                    this.returnToLobby();
                    this.isLevelTransitioning = false;
                } else {
                    audio.levelUp(); this.speedMultiplier = 1.0; this.totalBricksHitInLife = 0;
                    this.buildBricksForLevel(this.level);
                    this.resetBallAndPaddle();
                    this.renderHUDCanvas();
                    this.startLevelCountdown(() => { 
                        this.isLevelTransitioning = false;
                        this.launchBall(); 
                    });
                }
            }

            returnToLobby() {
                if (this.countdownTimer) clearInterval(this.countdownTimer);
                this.isCountdownActive = false;
                this.isLevelTransitioning = false;
                this.gameState = 'LOBBY';
                this.lobbyGroup.visible = true;
                this.gameOverGroup.visible = false;
                this.resetBallAndPaddle();
                this.renderHUDCanvas();
            }

            triggerGameOver() {
                if (this.countdownTimer) clearInterval(this.countdownTimer);
                this.isCountdownActive = false;
                this.isLevelTransitioning = false;
                this.gameState = 'GAMEOVER';
                audio.gameOver();
                showToast('GAME OVER! No lives remaining.', 'fa-skull');
                this.lobbyGroup.visible = false;
                this.renderGameOverCanvas();
                this.gameOverGroup.visible = true;
                this.resetBallAndPaddle();
                this.renderHUDCanvas();
            }

            updatePhysics(dt) {
                if (this.gameState !== 'PLAYING' || this.isCountdownActive || this.isLevelTransitioning) return;

                // 8-Note Audio Arpeggio Loop (Dynamic BPM)
                this.arpeggioTimer += dt;
                const currentInterval = Math.max(0.08, this.arpeggioBaseInterval / this.speedMultiplier);
                if (this.arpeggioTimer >= currentInterval) {
                    this.arpeggioTimer = 0;
                    audio.playArpeggioNote(this.arpeggioStep);
                    this.arpeggioStep = (this.arpeggioStep + 1) % 8;
                }

                // Independent Fire Timer
                if (this.isFireActive) {
                    this.fireTimer -= dt;
                    if (this.fireTimer <= 0) {
                        this.fireTimer = 0;
                        this.isFireActive = false;
                        this.refreshPaddleVisuals();
                        showToast('Fire Mode Expired', 'fa-fire-extinguisher');
                    }
                    this.renderHUDCanvas();
                }

                // Independent Explosive Timer
                if (this.isExplosiveActive) {
                    this.explosiveTimer -= dt;
                    if (this.explosiveTimer <= 0) {
                        this.explosiveTimer = 0;
                        this.isExplosiveActive = false;
                        this.balls.forEach(b => {
                            b.mesh.material.emissive.setHex(0x00f0ff);
                            if (b.mesh.children[0]) b.mesh.children[0].color.setHex(0x00ffff);
                        });
                        this.refreshPaddleVisuals();
                        showToast('Explosive Mode Expired', 'fa-bomb');
                    }
                    this.renderHUDCanvas();
                }

                // Independent 10s Barrier Shield Timer & Flashing
                if (this.hasBarrier) {
                    this.barrierTimer -= dt;
                    if (this.barrierTimer <= 0) {
                        this.barrierTimer = 0;
                        this.hasBarrier = false;
                        this.setHazardBarState(false);
                        this.refreshPaddleVisuals();
                        showToast('Barrier Shield Expired', 'fa-shield-halved');
                    } else if (this.barrierTimer <= 3.0) {
                        const flash = Math.floor(this.barrierTimer * 8) % 2 === 0;
                        this.setHazardBarState(flash);
                    } else {
                        this.setHazardBarState(true);
                    }
                    this.renderHUDCanvas();
                }

                const padBox = new THREE.Box3().setFromObject(this.paddleMesh);

                // POWER-UP PICKUPS
                for (let i = this.activePowerUps.length - 1; i >= 0; i--) {
                    const p = this.activePowerUps[i];
                    p.position.y -= 0.85 * dt;
                    p.rotation.y += dt * 3.0;
                    const pBox = new THREE.Box3().setFromObject(p);
                    
                    if (pBox.intersectsBox(padBox)) {
                        audio.powerUpPickup();
                        const type = p.userData.type;

                        if (type === '$') {
                            this.score += 300;
                            showToast('💰 BONUS $: +300 Points!', 'fa-coins');
                        } else if (type === 'S') {
                            this.updatePaddleVisuals('SPEED'); 
                            const speedReductionFactor = Math.pow(1.05, 3);
                            this.speedMultiplier = Math.max(1.0, this.speedMultiplier / speedReductionFactor);
                            this.balls.forEach(b => {
                                if (b.vel.length() > 0) b.vel.normalize().multiplyScalar(this.baseBallSpeed * this.speedMultiplier);
                            });
                            showToast('⚡ BONUS S: Speed Decremented!', 'fa-gauge-simple-low');
                        } else if (type === 'F') {
                            this.fireTimer = 8.0;
                            this.isFireActive = true;
                            this.updatePaddleVisuals('FIRE');
                            showToast('🔥 BONUS F: Fire Mode Active!', 'fa-fire');
                        } else if (type === 'L') {
                            this.updatePaddleVisuals('LIFE');
                            this.lives++;
                            showToast('❤️ BONUS L: Extra Life Added!', 'fa-heart');
                        } else if (type === 'X') {
                            this.explosiveTimer = 8.0;
                            this.isExplosiveActive = true;
                            this.balls.forEach(b => {
                                b.mesh.material.emissive.setHex(0xff0000);
                                if (b.mesh.children[0]) b.mesh.children[0].color.setHex(0xff0000);
                            });
                            this.updatePaddleVisuals('EXPLOSIVE');
                            showToast('💥 BONUS X: Explosive Area Impact!', 'fa-burst');
                        } else if (type === 'M') {
                            if (this.balls.length > 0) {
                                const refBall = this.balls[0];
                                const spd = refBall.vel.length() || (this.baseBallSpeed * this.speedMultiplier);
                                const currentAngle = Math.atan2(refBall.vel.y, refBall.vel.x);
                                const newAngle = currentAngle + (Math.random() > 0.5 ? 0.35 : -0.35);

                                const extraBall = this.createBallInstance(
                                    refBall.mesh.position.x, 
                                    refBall.mesh.position.y, 
                                    Math.cos(newAngle) * spd, 
                                    Math.sin(newAngle) * spd
                                );
                                this.balls.push(extraBall);
                            }
                            showToast('🎱 BONUS M: 1 Extra Ball Added!', 'fa-cubes');
                        } else if (type === 'B') {
                            this.hasBarrier = true;
                            this.barrierTimer = 10.0;
                            this.setHazardBarState(true);
                            this.updatePaddleVisuals('BARRIER');
                            showToast('🛡️ BONUS B: 10s Safety Barrier Active!', 'fa-shield-halved');
                        }

                        this.fieldGroup.remove(p);
                        p.geometry.dispose(); p.material.dispose();
                        this.activePowerUps.splice(i, 1);
                        this.renderHUDCanvas();
                        continue;
                    }

                    if (p.position.y < FIELD.bottomY) {
                        this.fieldGroup.remove(p);
                        p.geometry.dispose(); p.material.dispose();
                        this.activePowerUps.splice(i, 1);
                    }
                }

                // BULLETS PHYSICS
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const bullet = this.bullets[i];
                    bullet.position.y += 4.5 * dt;

                    if (bullet.position.y > FIELD.topY) {
                        this.fieldGroup.remove(bullet);
                        bullet.geometry.dispose(); bullet.material.dispose();
                        this.bullets.splice(i, 1);
                        continue;
                    }

                    const bulletBox = new THREE.Box3().setFromObject(bullet);
                    const bricks = this.bricksGroup.children;
                    let bulletHit = false;

                    for (let j = bricks.length - 1; j >= 0; j--) {
                        const b = bricks[j];
                        if (!b || !b.visible || !b.userData || !b.userData.active) continue;

                        const brickBox = new THREE.Box3().setFromObject(b);
                        if (brickBox.intersectsBox(bulletBox)) {
                            b.userData.active = false;
                            b.visible = false;
                            this.particlePool.explode(b.position, b.userData.colorHex);

                            if (this.isExplosiveActive) {
                                this.triggerAreaExplosion(b.position);
                            } else {
                                if (b.userData.hasBonus) this.spawnPowerUp(b.position, b.userData.hasBonus);
                                this.bricksGroup.remove(b);
                                if (b.geometry) b.geometry.dispose();
                                if (b.material) b.material.dispose();
                                this.score += b.userData.points;
                            }

                            audio.gunshot();
                            bulletHit = true;

                            if (this.getRemainingBricksCount() === 0) {
                                this.advanceLevel();
                                return;
                            } else {
                                this.renderHUDCanvas();
                            }
                            break;
                        }
                    }

                    if (bulletHit) {
                        this.fieldGroup.remove(bullet);
                        bullet.geometry.dispose(); bullet.material.dispose();
                        this.bullets.splice(i, 1);
                    }
                }

                // BALLS PHYSICS
                const halfCube = this.ballSide / 2; const halfW = FIELD.width / 2;

                for (let bIdx = this.balls.length - 1; bIdx >= 0; bIdx--) {
                    const ballObj = this.balls[bIdx];
                    const bMesh = ballObj.mesh;
                    const bVel = ballObj.vel;

                    bMesh.position.x += bVel.x * dt;
                    bMesh.position.y += bVel.y * dt;

                    if (bMesh.position.x - halfCube <= -halfW) {
                        bMesh.position.x = -halfW + halfCube; bVel.x = Math.abs(bVel.x); audio.wallHit();
                    } else if (bMesh.position.x + halfCube >= halfW) {
                        bMesh.position.x = halfW - halfCube; bVel.x = -Math.abs(bVel.x); audio.wallHit();
                    }

                    if (bMesh.position.y + halfCube >= FIELD.topY) {
                        bMesh.position.y = FIELD.topY - halfCube; bVel.y = -Math.abs(bVel.y); audio.wallHit();
                    }

                    if (bMesh.position.y - halfCube <= FIELD.bottomY) {
                        if (this.hasBarrier) {
                            bMesh.position.y = FIELD.bottomY + halfCube + 0.03;
                            bVel.y = Math.abs(bVel.y);
                            audio.shieldHit();
                            showToast('🛡️ Shield Absorbed Ball Impact!', 'fa-shield');
                        } else {
                            this.fieldGroup.remove(bMesh);
                            bMesh.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
                            this.balls.splice(bIdx, 1);

                            if (this.balls.length === 0) {
                                this.lives--; audio.lifeLost();
                                this.speedMultiplier = 1.0; this.totalBricksHitInLife = 0;
                                if (this.lives <= 0) {
                                    this.triggerGameOver();
                                } else {
                                    showToast(`Ball Lost! Lives Remaining: ${this.lives}`, 'fa-heart-crack');
                                    this.resetBallAndPaddle(); this.renderHUDCanvas();
                                    this.startLevelCountdown(() => { this.launchBall(); });
                                }
                                return;
                            }
                            continue;
                        }
                    }

                    const ballBox = new THREE.Box3().setFromObject(bMesh);
                    if (padBox.intersectsBox(ballBox) && bVel.y < 0) {
                        bVel.y = Math.abs(bVel.y);
                        const hitOffset = (bMesh.position.x - this.paddleMesh.position.x) / (this.paddleWidth / 2);
                        const currentSpeed = this.baseBallSpeed * this.speedMultiplier;
                        bVel.x = hitOffset * (currentSpeed * 0.85);
                        bVel.normalize().multiplyScalar(currentSpeed);
                        audio.paddleHit();
                    }

                    const bricks = this.bricksGroup.children;
                    for (let i = bricks.length - 1; i >= 0; i--) {
                        const b = bricks[i];
                        if (!b || !b.visible || !b.userData || !b.userData.active) continue;
                        const brickBox = new THREE.Box3().setFromObject(b);

                        if (brickBox.intersectsBox(ballBox)) {
                            b.userData.active = false;
                            b.visible = false;
                            this.particlePool.explode(b.position, b.userData.colorHex);

                            bVel.y = -bVel.y;

                            if (this.isExplosiveActive) {
                                this.triggerAreaExplosion(b.position);
                            } else {
                                if (b.userData.hasBonus) this.spawnPowerUp(b.position, b.userData.hasBonus);
                                this.bricksGroup.remove(b);
                                if (b.geometry) b.geometry.dispose();
                                if (b.material) b.material.dispose();
                                this.score += b.userData.points;
                            }

                            audio.gunshot();
                            this.totalBricksHitInLife++;

                            if (this.totalBricksHitInLife % 5 === 0) {
                                this.speedMultiplier *= 1.05;
                                const newSpeed = this.baseBallSpeed * this.speedMultiplier;
                                this.balls.forEach(ball => ball.vel.normalize().multiplyScalar(newSpeed));
                                audio.speedBoost();
                                showToast(`⚡ SPEED UP! Ball Speed: ${(this.speedMultiplier).toFixed(2)}x`, 'fa-bolt');
                            }

                            if (this.getRemainingBricksCount() === 0) {
                                this.advanceLevel();
                                return;
                            } else {
                                this.renderHUDCanvas();
                            }
                            break;
                        }
                    }
                }
            }

            updatePaddleAndControllers(dt) {
                const halfPad = this.paddleWidth / 2;
                const maxClampedX = FIELD.width / 2 - halfPad;

                if (this.renderer.xr.isPresenting) {
                    const session = this.renderer.xr.getSession();
                    if (session) {
                        for (const inputSource of session.inputSources) {
                            if (inputSource.gamepad) {
                                const gamepad = inputSource.gamepad;

                                if (inputSource.handedness === 'right') {
                                    const btnB = gamepad.buttons[5] || gamepad.buttons[1];
                                    if (btnB) {
                                        const isPressed = btnB.pressed;
                                        if (isPressed && !this.prevButtonBState) {
                                            audio.init(); this.toggleLaserRays();
                                        }
                                        this.prevButtonBState = isPressed;
                                    }
                                }

                                const axes = gamepad.axes;
                                if (axes && axes.length >= 2) {
                                    let axisX = 0, axisY = 0;
                                    if (axes.length >= 4) {
                                        axisX = axes[2];
                                        axisY = axes[3];
                                    } else {
                                        axisX = axes[0];
                                        axisY = axes[1];
                                    }

                                    if (Math.abs(axisX) > 0.20) {
                                        this.fieldScale += axisX * 0.8 * dt;
                                        this.fieldScale = THREE.MathUtils.clamp(this.fieldScale, 0.4, 2.5);
                                        this.fieldGroup.scale.setScalar(this.fieldScale);
                                        this.renderHUDCanvas();
                                    }

                                    if (Math.abs(axisY) > 0.20) {
                                        this.fieldPosY -= axisY * 0.8 * dt;
                                        this.fieldPosY = THREE.MathUtils.clamp(this.fieldPosY, -0.8, 1.2);
                                        this.fieldGroup.position.set(0, this.fieldPosY, FIELD.zPos);
                                        this.renderHUDCanvas();
                                    }
                                }
                            }
                        }
                    }

                    if (this.isDraggingHUD && this.hudDragController && this.hudDragTargetGroup) {
                        const ctrlPos = new THREE.Vector3();
                        const ctrlQuat = new THREE.Quaternion();
                        this.hudDragController.matrixWorld.decompose(ctrlPos, ctrlQuat, new THREE.Vector3());

                        this.hudDragTargetGroup.position.x = ctrlPos.x + this.hudDragOffsetXZ.x;
                        this.hudDragTargetGroup.position.z = ctrlPos.z + this.hudDragOffsetXZ.y;

                        const euler = new THREE.Euler().setFromQuaternion(ctrlQuat, 'YXZ');
                        this.hudDragTargetGroup.rotation.set(0, euler.y, 0);
                    }

                    let activeController = null;
                    if (session && session.inputSources) {
                        const targetHandStr = this.activeHand.toLowerCase();
                        for (let i = 0; i < session.inputSources.length; i++) {
                            const src = session.inputSources[i];
                            if (src.handedness === targetHandStr) {
                                activeController = this.controllers[i] || this.controllers[0]; break;
                            }
                        }
                    }
                    if (!activeController) activeController = (this.activeHand === 'RIGHT') ? (this.controllers[1] || this.controllers[0]) : (this.controllers[0] || this.controllers[1]);

                    if (activeController) {
                        if (this.controlMode === 'RAY') {
                            this.tempMatrix.identity().extractRotation(activeController.matrixWorld);
                            this.rayOrigin.setFromMatrixPosition(activeController.matrixWorld);
                            this.rayDir.set(0, 0, -1).applyMatrix4(this.tempMatrix);
                            const ray = new THREE.Ray(this.rayOrigin, this.rayDir);
                            if (ray.intersectPlane(this.playfieldPlane, this.targetPoint)) {
                                this.paddleX = this.targetPoint.x / this.fieldScale;
                            }
                        } else if (this.controlMode === 'TILT') {
                            const euler = new THREE.Euler().setFromQuaternion(activeController.quaternion, 'ZYX');
                            const rollAngle = euler.z;
                            this.paddleX = -rollAngle * (FIELD.width / 1.2) * this.paddleSensitivity;
                        }
                    }
                }

                const lasersVisible = (this.gameState !== 'PLAYING') || this.showLasersInGame;
                this.controllers.forEach((ctrl) => {
                    const line = ctrl.getObjectByName('laserLine'); const reticle = ctrl.getObjectByName('pointerReticle');
                    if (line) line.visible = lasersVisible; if (reticle) reticle.visible = lasersVisible;
                });

                this.paddleX = THREE.MathUtils.clamp(this.paddleX, -maxClampedX, maxClampedX);
                this.paddleMesh.position.x = this.paddleX;
            }

            render(timestamp, frame) {
                const dt = 0.016;
                this.updatePaddleAndControllers(dt);
                this.updatePhysics(dt);
                this.particlePool.update(dt);
                this.renderer.render(this.scene, this.camera);
            }
        }

        window.onload = () => { window.app = new ARkaniumXRApp(); };
    </script>
</body>
</html>
