<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARkanium - v1.9.0</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="text-white">

    <!-- WebGL Canvas Container -->
    <div id="webgl-container"></div>

    <!-- Top Desktop / Mobile Overlay UI -->
    <div id="overlay-ui" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-6 z-10">
        <div class="flex justify-between items-center w-full">
            <div class="glass-panel px-4 py-2 rounded-xl flex items-center space-x-3 pointer-events-auto">
                <i class="fa-solid fa-cubes text-cyan-400 text-xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wider bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
                        ARKANIUM
                    </h1>
                    <p class="text-xs text-gray-400">Versione <span class="text-cyan-300 font-mono">v1.9.0</span></p>
                </div>
            </div>

            <!-- WebXR Session Buttons -->
            <div class="flex space-x-3 pointer-events-auto">
                <button id="btn-ar" class="glass-panel hover:bg-cyan-600/30 text-cyan-300 hover:text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-all flex items-center space-x-2 border border-cyan-500/30">
                    <i class="fa-solid fa-vr-cardboard text-lg"></i>
                    <span>ENTRA IN AR</span>
                </button>
                <button id="btn-vr" class="glass-panel bg-indigo-600/40 hover:bg-indigo-600/70 text-indigo-200 hover:text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-all flex items-center space-x-2 border border-indigo-500/40 shadow-lg shadow-indigo-900/30">
                    <i class="fa-solid fa-headset text-lg"></i>
                    <span>ENTRA IN VR</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Game Engine Logic -->
    <script>
        const VERSION = "v1.9.0";
        
        // Field Dimensions (height 2.70m, depth 20cm, bottom 30cm off floor)
        const FIELD = {
            width: 2.0,
            height: 2.70,
            depth: 0.20,
            bottomY: 0.30, 
            get centerY() { return this.bottomY + (this.height / 2); },
            get topY() { return this.bottomY + this.height; },
            zPos: -1.8
        };

        const BRICKS_COLS = 13;
        const ROW_COLORS = [0xff3366, 0xff9900, 0xffcc00, 0x33cc66, 0x3399ff, 0xa855f7];

        // --- AUDIO SYNTHESIZER ---
        class RetroSoundEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }
            playTone(freq, type = 'square', duration = 0.1, gainVal = 0.15) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }
            paddleHit() { this.playTone(320, 'square', 0.08, 0.2); }
            wallHit() { this.playTone(220, 'triangle', 0.06, 0.15); }
            brickHit(pitch = 0) { this.playTone(440 + (pitch * 35), 'square', 0.1, 0.22); }
            scoreUp() {
                if (!this.ctx) return;
                this.playTone(587.33, 'sine', 0.08, 0.2);
                setTimeout(() => this.playTone(880, 'sine', 0.15, 0.2), 80);
            }
            gameOver() {
                if (!this.ctx) return;
                [300, 260, 220, 180].forEach((f, i) => setTimeout(() => this.playTone(f, 'sawtooth', 0.2, 0.25), i * 150));
            }
        }

        const audio = new RetroSoundEngine();

        class ArkanoidApp {
            constructor() {
                this.container = document.getElementById('webgl-container');
                this.gameState = 'LOBBY';
                this.score = 0;
                this.lives = 3;
                this.level = 1;
                this.bricksRemaining = 0;
                this.bricksHitTotal = 0;
                
                this.baseBallSpeed = 1.8;
                this.ballSpeedMultiplier = 1.0;
                this.ballVelocity = new THREE.Vector3(0, 0, 0);

                // Control Settings
                this.controlMode = 'RAGGIO';
                this.activeHand = 'DESTRO';
                this.sensitivity = 1.8;

                // HUD Grabbing State
                this.isHudGrabbed = false;
                this.hudGrabOffset = new THREE.Vector3();

                // Rays visibility state
                this.raysVisible = false;

                this.mousePosition = new THREE.Vector2();
                this.interactiveObjects = [];
                this.raycaster = new THREE.Raycaster();
                this.tempMatrix = new THREE.Matrix4();

                this.initScene();
                this.initLights();
                this.initFieldGeometry();
                this.initPaddleAndBall();
                this.initLobbyPanel();
                this.initDebugHUD();
                this.initWebXR();
                this.initEventListeners();

                this.renderer.setAnimationLoop((t, frame) => this.render(t, frame));
            }

            initScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0d14);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50);
                this.camera.position.set(0, 1.6, 1.2);

                // Fixed WebGL Renderer initialization (removed powerPreference causing exception)
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.xr.enabled = true;
                
                this.container.appendChild(this.renderer.domElement);
            }

            initLights() {
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
                dirLight.position.set(2, 4, 1);
                dirLight.castShadow = true;
                this.scene.add(dirLight);

                const blueGlow = new THREE.PointLight(0x00f0ff, 1.2, 5);
                blueGlow.position.set(-FIELD.width / 2 - 0.2, FIELD.centerY, FIELD.zPos + 0.2);
                this.scene.add(blueGlow);

                const magentaGlow = new THREE.PointLight(0xff00a0, 1.2, 5);
                magentaGlow.position.set(FIELD.width / 2 + 0.2, FIELD.centerY, FIELD.zPos + 0.2);
                this.scene.add(magentaGlow);
            }

            initFieldGeometry() {
                this.fieldGroup = new THREE.Group();
                this.fieldGroup.position.set(0, 0, FIELD.zPos);

                const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.2 });
                const wallThick = 0.08;
                
                // Left Wall
                const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThick, FIELD.height, FIELD.depth), frameMat);
                leftWall.position.set(-FIELD.width / 2 - wallThick / 2, FIELD.centerY, 0);
                this.fieldGroup.add(leftWall);

                // Right Wall
                const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThick, FIELD.height, FIELD.depth), frameMat);
                rightWall.position.set(FIELD.width / 2 + wallThick / 2, FIELD.centerY, 0);
                this.fieldGroup.add(rightWall);

                // Top Wall
                const topWall = new THREE.Mesh(new THREE.BoxGeometry(FIELD.width + (wallThick * 2), wallThick, FIELD.depth), frameMat);
                topWall.position.set(0, FIELD.topY + wallThick / 2, 0);
                this.fieldGroup.add(topWall);

                // Back Wall Grid Panel
                const backGeo = new THREE.PlaneGeometry(FIELD.width, FIELD.height);
                const backMat = new THREE.MeshStandardMaterial({ color: 0x0b132b, roughness: 0.5, transparent: true, opacity: 0.85 });
                const backMesh = new THREE.Mesh(backGeo, backMat);
                backMesh.position.set(0, FIELD.centerY, -FIELD.depth / 2);
                this.fieldGroup.add(backMesh);

                const gridHelper = new THREE.GridHelper(FIELD.height, 15, 0x00f0ff, 0x1e293b);
                gridHelper.rotation.x = Math.PI / 2;
                gridHelper.position.set(0, FIELD.centerY, -FIELD.depth / 2 + 0.01);
                this.fieldGroup.add(gridHelper);

                // Bottom Rail
                const railGeo = new THREE.CylinderGeometry(0.015, 0.015, FIELD.width);
                const railMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.9, roughness: 0.1 });
                const railMesh = new THREE.Mesh(railGeo, railMat);
                railMesh.rotation.z = Math.PI / 2;
                railMesh.position.set(0, FIELD.bottomY + 0.1, 0);
                this.fieldGroup.add(railMesh);

                this.scene.add(this.fieldGroup);
                this.bricksGroup = new THREE.Group();
                this.fieldGroup.add(this.bricksGroup);
            }

            buildBrickMatrix() {
                while (this.bricksGroup.children.length > 0) {
                    const b = this.bricksGroup.children.pop();
                    b.geometry.dispose();
                    b.material.dispose();
                }

                const rows = 3 + this.level;
                const gap = 0.012;
                const totalGapsX = (BRICKS_COLS - 1) * gap;
                const brickWidth = (FIELD.width - 0.08 - totalGapsX) / BRICKS_COLS;
                const brickHeight = brickWidth / 2; // Rectangular: width is double height

                const startX = -FIELD.width / 2 + 0.04 + (brickWidth / 2);
                const startY = FIELD.topY - 0.25;

                this.bricksRemaining = BRICKS_COLS * rows;

                for (let r = 0; r < rows; r++) {
                    const rowColor = ROW_COLORS[r % ROW_COLORS.length];
                    const mat = new THREE.MeshStandardMaterial({
                        color: rowColor,
                        metalness: 0.3,
                        roughness: 0.2,
                        emissive: rowColor,
                        emissiveIntensity: 0.25
                    });
                    const geo = new THREE.BoxGeometry(brickWidth, brickHeight, 0.12);

                    for (let c = 0; c < BRICKS_COLS; c++) {
                        const brick = new THREE.Mesh(geo, mat);
                        const px = startX + c * (brickWidth + gap);
                        const py = startY - r * (brickHeight + gap);
                        
                        brick.position.set(px, py, 0);
                        brick.castShadow = true;
                        brick.receiveShadow = true;
                        
                        brick.userData = {
                            isBrick: true,
                            row: r,
                            col: c,
                            width: brickWidth,
                            height: brickHeight,
                            points: (rows - r) * 10
                        };

                        this.bricksGroup.add(brick);
                    }
                }
            }

            initPaddleAndBall() {
                this.paddleWidth = 0.38;
                this.paddleHeight = 0.06;
                this.paddleDepth = 0.12;

                const paddleGeo = new THREE.BoxGeometry(this.paddleWidth, this.paddleHeight, this.paddleDepth);
                const paddleMat = new THREE.MeshStandardMaterial({
                    color: 0x00f0ff,
                    metalness: 0.8,
                    roughness: 0.2,
                    emissive: 0x0077aa,
                    emissiveIntensity: 0.4
                });

                this.paddle = new THREE.Mesh(paddleGeo, paddleMat);
                this.resetPaddlePosition();
                this.fieldGroup.add(this.paddle);

                this.ballRadius = 0.045;
                const ballGeo = new THREE.SphereGeometry(this.ballRadius, 32, 32);
                const ballMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0xffffff,
                    emissiveIntensity: 0.6
                });

                this.ball = new THREE.Mesh(ballGeo, ballMat);
                this.ballLight = new THREE.PointLight(0x00f0ff, 1.5, 1.5);
                this.ball.add(this.ballLight);

                this.resetBall();
                this.fieldGroup.add(this.ball);
            }

            resetPaddlePosition() {
                this.paddle.position.set(0, FIELD.bottomY + 0.1, 0);
            }

            resetBall() {
                this.ball.position.set(0, FIELD.centerY - 0.3, 0);
                this.ballVelocity.set(0, 0, 0);
            }

            launchBall() {
                const angle = (Math.random() * 0.6 - 0.3) * Math.PI;
                const speed = this.baseBallSpeed * this.ballSpeedMultiplier;
                this.ballVelocity.set(Math.sin(angle) * speed, -Math.cos(angle) * speed, 0);
            }

            initLobbyPanel() {
                this.lobbyGroup = new THREE.Group();
                this.lobbyGroup.position.set(0, 1.6, -1.1);

                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 10;
                ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 25;
                ctx.font = '900 110px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ARKANIUM', canvas.width / 2, canvas.height / 2 + 20);

                this.lobbyTexture = new THREE.CanvasTexture(canvas);
                const panelGeo = new THREE.PlaneGeometry(1.2, 0.6);
                const panelMat = new THREE.MeshBasicMaterial({ map: this.lobbyTexture, transparent: true, side: THREE.DoubleSide });
                const panelMesh = new THREE.Mesh(panelGeo, panelMat);
                this.lobbyGroup.add(panelMesh);

                const btnGeo = new THREE.BoxGeometry(0.5, 0.12, 0.05);
                const btnMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x047857, emissiveIntensity: 0.5 });
                this.startButtonMesh = new THREE.Mesh(btnGeo, btnMat);
                this.startButtonMesh.position.set(0, -0.22, 0.04);
                this.startButtonMesh.userData = { isButton: true, action: 'START_GAME' };

                const btnCanvas = document.createElement('canvas');
                btnCanvas.width = 512; btnCanvas.height = 128;
                const bCtx = btnCanvas.getContext('2d');
                bCtx.fillStyle = '#10b981'; bCtx.fillRect(0,0,512,128);
                bCtx.fillStyle = '#ffffff'; bCtx.font = 'bold 44px sans-serif'; bCtx.textAlign='center'; bCtx.textBaseline='middle';
                bCtx.fillText('▶ INIZIA GIOCO', 256, 64);

                const btnLabel = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.48, 0.11),
                    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(btnCanvas), transparent: true })
                );
                btnLabel.position.z = 0.028;
                this.startButtonMesh.add(btnLabel);

                this.lobbyGroup.add(this.startButtonMesh);
                this.interactiveObjects.push(this.startButtonMesh);

                this.scene.add(this.lobbyGroup);
            }

            initDebugHUD() {
                this.hudGroup = new THREE.Group();
                this.hudGroup.position.set(-1.4, 1.5, -1.2);
                this.hudGroup.rotation.y = Math.PI / 8;

                const hudWidth = 0.8;
                const hudHeight = 1.2;

                this.hudCanvas = document.createElement('canvas');
                this.hudCanvas.width = 512;
                this.hudCanvas.height = 768;
                this.hudCtx = this.hudCanvas.getContext('2d');

                this.hudTexture = new THREE.CanvasTexture(this.hudCanvas);
                const hudGeo = new THREE.PlaneGeometry(hudWidth, hudHeight);
                const hudMat = new THREE.MeshBasicMaterial({ map: this.hudTexture, transparent: true, side: THREE.DoubleSide });
                this.hudMesh = new THREE.Mesh(hudGeo, hudMat);
                this.hudMesh.userData = { isHudPanel: true };
                this.hudGroup.add(this.hudMesh);
                this.interactiveObjects.push(this.hudMesh);

                const hudFrame = new THREE.Mesh(
                    new THREE.BoxGeometry(hudWidth + 0.02, hudHeight + 0.02, 0.01),
                    new THREE.MeshStandardMaterial({ color: 0x1e1b4b, metalness: 0.8, roughness: 0.3 })
                );
                hudFrame.position.z = -0.008;
                this.hudGroup.add(hudFrame);

                this.createHUDButton('ESCI', -0.2, -0.45, 0.32, 0.08, 0xef4444, 'EXIT_LOBBY');
                this.createHUDButton('RESET', 0.2, -0.45, 0.32, 0.08, 0x3b82f6, 'RESET_GAME');
                
                this.createHUDButton('SENS -', -0.2, -0.34, 0.32, 0.07, 0x8b5cf6, 'SENS_DOWN');
                this.createHUDButton('SENS +', 0.2, -0.34, 0.32, 0.07, 0x8b5cf6, 'SENS_UP');

                this.createHUDButton('MODO', -0.2, -0.23, 0.32, 0.07, 0x10b981, 'TOGGLE_MODE');
                this.createHUDButton('MANO', 0.2, -0.23, 0.32, 0.07, 0xf59e0b, 'TOGGLE_HAND');

                this.scene.add(this.hudGroup);
                this.updateHUDCanvas();
            }

            createHUDButton(label, x, y, w, h, colorHex, action) {
                const btnGeo = new THREE.BoxGeometry(w, h, 0.03);
                const btnMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.3 });
                const btn = new THREE.Mesh(btnGeo, btnMat);
                btn.position.set(x, y, 0.02);
                btn.userData = { isButton: true, action: action };

                const bCanvas = document.createElement('canvas'); bCanvas.width = 256; bCanvas.height = 64;
                const bCtx = bCanvas.getContext('2d');
                bCtx.fillStyle = '#' + colorHex.toString(16).padStart(6, '0'); bCtx.fillRect(0,0,256,64);
                bCtx.fillStyle = '#ffffff'; bCtx.font = 'bold 24px sans-serif'; bCtx.textAlign='center'; bCtx.textBaseline='middle';
                bCtx.fillText(label, 128, 32);

                const bMesh = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.95, h * 0.9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(bCanvas), transparent: true }));
                bMesh.position.z = 0.016;
                btn.add(bMesh);

                this.hudGroup.add(btn);
                this.interactiveObjects.push(btn);
            }

            updateHUDCanvas() {
                const ctx = this.hudCtx;
                const w = this.hudCanvas.width;
                const h = this.hudCanvas.height;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
                ctx.fillRect(0, 0, w, h);

                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ARKANIUM HUD', w / 2, 45);

                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(20, 65); ctx.lineTo(w - 20, 65); ctx.stroke();

                ctx.textAlign = 'left';
                ctx.font = '26px monospace';
                
                const lines = [
                    { label: 'STATO:', val: this.gameState, color: '#facc15' },
                    { label: 'PUNTEGGIO:', val: `${this.score}`, color: '#ffffff' },
                    { label: 'VITE:', val: '❤️ '.repeat(Math.max(0, this.lives)), color: '#f43f5e' },
                    { label: 'LIVELLO:', val: `${this.level}`, color: '#38bdf8' },
                    { label: 'MATTONI:', val: `${this.bricksRemaining}`, color: '#fb923c' },
                    { label: 'SENSIBILITÀ:', val: `${this.sensitivity.toFixed(1)}x`, color: '#c084fc' },
                    { label: 'MODALITÀ:', val: this.controlMode, color: '#4ade80' },
                    { label: 'MANO:', val: this.activeHand, color: '#f43f5e' }
                ];

                let y = 115;
                lines.forEach(item => {
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillText(item.label, 30, y);
                    ctx.fillStyle = item.color;
                    ctx.fillText(item.val, 260, y);
                    y += 45;
                });

                this.hudTexture.needsUpdate = true;
            }

            initWebXR() {
                document.getElementById('btn-vr').addEventListener('click', () => { audio.init(); this.requestXRSession('immersive-vr'); });
                document.getElementById('btn-ar').addEventListener('click', () => { audio.init(); this.requestXRSession('immersive-ar'); });

                this.controller1 = this.renderer.xr.getController(0);
                this.controller1.addEventListener('selectstart', (e) => this.onSelectStart(e, 0));
                this.controller1.addEventListener('squeezestart', (e) => this.onSqueezeStart(e, 0));
                this.controller1.addEventListener('squeezeend', (e) => this.onSqueezeEnd(e, 0));
                this.scene.add(this.controller1);

                this.controller2 = this.renderer.xr.getController(1);
                this.controller2.addEventListener('selectstart', (e) => this.onSelectStart(e, 1));
                this.controller2.addEventListener('squeezestart', (e) => this.onSqueezeStart(e, 1));
                this.controller2.addEventListener('squeezeend', (e) => this.onSqueezeEnd(e, 1));
                this.scene.add(this.controller2);

                const rayGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -3)]);
                const rayMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.6 });
                
                this.ray1 = new THREE.Line(rayGeo, rayMat);
                this.controller1.add(this.ray1);
                
                this.ray2 = new THREE.Line(rayGeo, rayMat);
                this.controller2.add(this.ray2);

                this.renderer.xr.addEventListener('sessionstart', () => {
                    this.renderer.xr.setReferenceSpaceType('local-floor');
                });
            }

            async requestXRSession(mode) {
                if (!navigator.xr) return;
                try {
                    const session = await navigator.xr.requestSession(mode, { optionalFeatures: ['local-floor', 'bounded-floor'] });
                    this.renderer.xr.setSession(session);
                    document.getElementById('overlay-ui').style.display = 'none';
                    if (mode === 'immersive-ar') this.scene.background = null;
                } catch (e) { console.error(e); }
            }

            onSelectStart(event, controllerIndex) {
                audio.init();
                const controller = event.target;
                this.tempMatrix.identity().extractRotation(controller.matrixWorld);

                this.raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                this.raycaster.ray.direction.set(0, 0, -1).applyMatrix4(this.tempMatrix);

                const intersects = this.raycaster.intersectObjects(this.interactiveObjects, true);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    if (obj.userData.isHudPanel) {
                        this.isHudGrabbed = true;
                        this.hudGrabController = controller;
                        this.hudGrabOffset.copy(this.hudGroup.position).sub(controller.position);
                        return;
                    }

                    while (obj && !obj.userData.action && obj.parent) {
                        obj = obj.parent;
                    }
                    if (obj && obj.userData.action) {
                        this.handleUIAction(obj.userData.action);
                    }
                }
            }

            onSqueezeStart(event, index) {
                const controller = event.target;
                const dist = controller.position.distanceTo(this.hudGroup.position);
                if (dist < 0.6) {
                    this.isHudGrabbed = true;
                    this.hudGrabController = controller;
                    this.hudGrabOffset.copy(this.hudGroup.position).sub(controller.position);
                }
            }

            onSqueezeEnd(event, index) {
                if (this.isHudGrabbed && event.target === this.hudGrabController) {
                    this.isHudGrabbed = false;
                }
            }

            handleUIAction(action) {
                audio.scoreUp();
                switch(action) {
                    case 'START_GAME':
                        this.startGame();
                        break;
                    case 'EXIT_LOBBY':
                        this.resetToLobby();
                        break;
                    case 'RESET_GAME':
                        this.startGame();
                        break;
                    case 'SENS_DOWN':
                        this.sensitivity = Math.max(1.0, this.sensitivity - 0.3);
                        break;
                    case 'SENS_UP':
                        this.sensitivity = Math.min(5.0, this.sensitivity + 0.3);
                        break;
                    case 'TOGGLE_MODE':
                        this.controlMode = this.controlMode === 'RAGGIO' ? 'TILT' : 'RAGGIO';
                        break;
                    case 'TOGGLE_HAND':
                        this.activeHand = this.activeHand === 'DESTRO' ? 'SINISTRO' : 'DESTRO';
                        break;
                }
                this.updateHUDCanvas();
            }

            initEventListeners() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                window.addEventListener('keydown', (e) => {
                    if (e.key.toLowerCase() === 'b') {
                        this.raysVisible = !this.raysVisible;
                    }
                });
            }

            startGame() {
                this.gameState = 'PLAYING';
                this.score = 0;
                this.lives = 3;
                this.level = 1;
                this.bricksHitTotal = 0;
                this.ballSpeedMultiplier = 1.0;
                this.lobbyGroup.visible = false;
                this.buildBrickMatrix();
                this.resetPaddlePosition();
                this.resetBall();
                this.launchBall();
                audio.scoreUp();
                this.updateHUDCanvas();
            }

            resetToLobby() {
                this.gameState = 'LOBBY';
                this.lobbyGroup.visible = true;
                this.resetPaddlePosition();
                this.resetBall();
                this.updateHUDCanvas();
            }

            updatePaddlePosition(targetX) {
                const maxExtent = (FIELD.width / 2) - (this.paddleWidth / 2);
                this.paddle.position.x = THREE.MathUtils.clamp(targetX, -maxExtent, maxExtent);
            }

            checkGamepadBButton() {
                if (!this.renderer.xr.isPresenting) return;
                const session = this.renderer.xr.getSession();
                if (!session || !session.inputSources) return;

                for (let source of session.inputSources) {
                    if (source.gamepad) {
                        const gp = source.gamepad;
                        if (gp.buttons && gp.buttons[5] && gp.buttons[5].pressed) {
                            if (!this._bPressedLastFrame) {
                                this.raysVisible = !this.raysVisible;
                                this._bPressedLastFrame = true;
                            }
                        } else {
                            this._bPressedLastFrame = false;
                        }
                    }
                }
            }

            updateXRControllers() {
                if (!this.renderer.xr.isPresenting) return;
                
                this.checkGamepadBButton();

                if (this.ray1 && this.ray2) {
                    this.ray1.visible = this.raysVisible;
                    this.ray2.visible = this.raysVisible;
                }

                const session = this.renderer.xr.getSession();
                if (!session) return;

                const ctrl = this.activeHand === 'DESTRO' ? this.controller2 : this.controller1;
                if (!ctrl) return;

                if (this.isHudGrabbed && this.hudGrabController) {
                    this.hudGroup.position.copy(this.hudGrabController.position).add(this.hudGrabOffset);
                    return;
                }

                if (this.gameState === 'PLAYING') {
                    if (this.controlMode === 'RAGGIO') {
                        const tempMat = new THREE.Matrix4().extractRotation(ctrl.matrixWorld);
                        const rayOrigin = new THREE.Vector3().setFromMatrixPosition(ctrl.matrixWorld);
                        const rayDir = new THREE.Vector3(0, 0, -1).applyMatrix4(tempMat);

                        const planeZ = FIELD.zPos;
                        if (rayDir.z !== 0) {
                            const t = (planeZ - rayOrigin.z) / rayDir.z;
                            if (t > 0) {
                                const hitX = rayOrigin.x + rayDir.x * t;
                                this.updatePaddlePosition(hitX);
                            }
                        }
                    } else {
                        const euler = new THREE.Euler().setFromRotationMatrix(ctrl.matrixWorld, 'YXZ');
                        const tilt = euler.z;
                        const targetX = tilt * this.sensitivity * 1.5;
                        this.updatePaddlePosition(targetX);
                    }
                }
            }

            updatePhysics(delta) {
                if (this.gameState !== 'PLAYING') return;

                this.ball.position.addScaledVector(this.ballVelocity, delta);

                const bPos = this.ball.position;
                const r = this.ballRadius;
                const minX = -FIELD.width / 2 + r;
                const maxX = FIELD.width / 2 - r;
                const maxY = FIELD.topY - r;

                if (bPos.x <= minX) { bPos.x = minX; this.ballVelocity.x *= -1; audio.wallHit(); }
                else if (bPos.x >= maxX) { bPos.x = maxX; this.ballVelocity.x *= -1; audio.wallHit(); }
                if (bPos.y >= maxY) { bPos.y = maxY; this.ballVelocity.y *= -1; audio.wallHit(); }

                const pPos = this.paddle.position;
                const halfPWidth = this.paddleWidth / 2;
                const halfPHeight = this.paddleHeight / 2;

                if (bPos.y - r <= pPos.y + halfPHeight && 
                    bPos.y + r >= pPos.y - halfPHeight &&
                    bPos.x >= pPos.x - halfPWidth && 
                    bPos.x <= pPos.x + halfPWidth &&
                    this.ballVelocity.y < 0) {
                    
                    bPos.y = pPos.y + halfPHeight + r;
                    const hitOffset = (bPos.x - pPos.x) / halfPWidth;
                    const bounceAngle = hitOffset * (Math.PI / 3);
                    const speed = this.ballVelocity.length();
                    this.ballVelocity.x = Math.sin(bounceAngle) * speed;
                    this.ballVelocity.y = Math.cos(bounceAngle) * speed;
                    audio.paddleHit();
                }

                const bricks = this.bricksGroup.children;
                for (let i = bricks.length - 1; i >= 0; i--) {
                    const brick = bricks[i];
                    if (!brick.visible) continue;

                    const bX = brick.position.x;
                    const bY = brick.position.y;
                    const w2 = brick.userData.width / 2;
                    const h2 = brick.userData.height / 2;

                    if (bPos.x + r >= bX - w2 && bPos.x - r <= bX + w2 &&
                        bPos.y + r >= bY - h2 && bPos.y - r <= bY + h2) {
                        
                        this.bricksGroup.remove(brick);
                        brick.geometry.dispose();
                        brick.material.dispose();

                        this.score += brick.userData.points;
                        this.bricksRemaining--;
                        this.bricksHitTotal++;

                        if (this.bricksHitTotal % 7 === 0) {
                            this.ballSpeedMultiplier += 0.15;
                        }

                        this.ballVelocity.y *= -1;
                        audio.brickHit(brick.userData.row);

                        if (this.bricksRemaining <= 0) {
                            audio.scoreUp();
                            this.level++;
                            this.buildBrickMatrix();
                            this.resetBall();
                            this.launchBall();
                        }
                        this.updateHUDCanvas();
                        break;
                    }
                }

                if (bPos.y < FIELD.bottomY - 0.2) {
                    this.lives--;
                    audio.gameOver();
                    this.ballSpeedMultiplier = 1.0;

                    if (this.lives <= 0) {
                        this.gameState = 'GAMEOVER';
                        setTimeout(() => this.resetToLobby(), 2000);
                    } else {
                        this.resetBall();
                        this.launchBall();
                    }
                    this.updateHUDCanvas();
                }
            }

            render(time, frame) {
                const delta = 0.016;
                this.updateXRControllers();
                this.updatePhysics(delta);
                this.renderer.render(this.scene, this.camera);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.app = new ArkanoidApp();
        });
    </script>
</body>
</html>
