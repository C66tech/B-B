<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR 3D Arkanoid - v1.1.0</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="text-white">

    <!-- WebGL Canvas Container -->
    <div id="webgl-container"></div>

    <!-- Desktop / Mobile Overlay UI -->
    <div id="overlay-ui" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-6 z-10">
        <!-- Top Header Bar -->
        <div class="flex justify-between items-center w-full">
            <div class="glass-panel px-4 py-2 rounded-xl flex items-center space-x-3 pointer-events-auto">
                <i class="fa-solid fa-cubes text-cyan-400 text-xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wider bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
                        ARKANOID 3D XR
                    </h1>
                    <p class="text-xs text-gray-400">Versione <span class="text-cyan-300 font-mono">v1.1.0</span></p>
                </div>
            </div>

            <!-- WebXR Session Buttons -->
            <div class="flex space-x-3 pointer-events-auto">
                <button id="btn-ar" class="glass-panel hover:bg-cyan-600/30 text-cyan-300 hover:text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-all flex items-center space-x-2 border border-cyan-500/30">
                    <i class="fa-solid fa-vr-cardboard text-lg"></i>
                    <span>ENTRA IN AR</span>
                </button>
                <button id="btn-vr" class="glass-panel bg-indigo-600/40 hover:bg-indigo-600/70 text-indigo-200 hover:text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-all flex items-center space-x-2 border border-indigo-500/40 shadow-lg shadow-indigo-900/30">
                    <i class="fa-solid fa-headset text-lg"></i>
                    <span>ENTRA IN VR</span>
                </button>
            </div>
        </div>

        <!-- Non-XR Desktop Hint -->
        <div id="desktop-controls-hint" class="glass-panel p-4 rounded-xl max-w-sm pointer-events-auto mb-4 self-start border-l-4 border-l-cyan-400">
            <h3 class="text-xs font-bold uppercase tracking-wider text-cyan-400 mb-1">Modalità Anteprima Desktop</h3>
            <p class="text-xs text-gray-300 leading-relaxed">
                Usa il <b>Mouse</b> per ruotare la visuale. Muovi il cursore orizzontalmente per guidare il Pad durante il gioco.
                I pulsanti 3D sono interattivi tramite click.
            </p>
        </div>
    </div>

    <!-- Game Engine Logic -->
    <script>
        // --- CONSTANTS & CONFIGURATION ---
        const VERSION = "v1.1.0";
        
        // Field Dimensions (meters)
        const FIELD = {
            width: 2.0,
            height: 3.0,
            depth: 0.3,
            bottomY: 0.5, // 50 cm off floor
            get centerY() { return this.bottomY + (this.height / 2); },
            get topY() { return this.bottomY + this.height; },
            zPos: -1.8 // Field Z offset from origin
        };

        // Brick Grid Specs
        const BRICKS_COLS = 11;
        const BRICKS_ROWS = 5;
        const BRICK_DEPTH = 0.12;

        // Colors per brick row
        const ROW_COLORS = [
            0xff3366, // Red/Pink
            0xff9900, // Orange
            0xffcc00, // Yellow
            0x33cc66, // Green
            0x3399ff  // Cyan/Blue
        ];

        // --- AUDIO SYNTHESIZER (Web Audio API) ---
        class RetroSoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }

            playTone(freq, type = 'square', duration = 0.1, gainVal = 0.15) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { console.error(e); }
            }

            paddleHit() {
                this.playTone(320, 'square', 0.08, 0.2);
            }

            wallHit() {
                this.playTone(220, 'triangle', 0.06, 0.15);
            }

            brickHit(pitchOffset = 0) {
                this.playTone(440 + (pitchOffset * 40), 'square', 0.1, 0.25);
            }

            scoreUp() {
                if (!this.ctx) return;
                this.playTone(587.33, 'sine', 0.08, 0.2); // D5
                setTimeout(() => this.playTone(880, 'sine', 0.15, 0.2), 80); // A5
            }

            gameOver() {
                if (!this.ctx) return;
                const notes = [300, 260, 220, 180];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sawtooth', 0.2, 0.25), idx * 150);
                });
            }
        }

        const audio = new RetroSoundEngine();

        // --- MAIN GAME APPLICATION ---
        class ArkanoidXRApp {
            constructor() {
                this.container = document.getElementById('webgl-container');
                
                // Game States: 'LOBBY', 'PLAYING', 'GAMEOVER', 'PAUSED'
                this.gameState = 'LOBBY';
                this.score = 0;
                this.lives = 3;
                this.bricksRemaining = 0;
                this.fps = 60;
                this.frameCount = 0;
                this.lastTime = performance.now();

                // Ball Physics
                this.ballSpeedMultiplier = 1.0;
                this.baseBallSpeed = 1.8; // m/s
                this.ballVelocity = new THREE.Vector3(0, 0, 0);

                // Controller tracking
                this.rightController = null;
                this.rightControllerGrip = null;
                this.raycaster = new THREE.Raycaster();
                this.tempMatrix = new THREE.Matrix4();

                // Mouse fallback
                this.mousePosition = new THREE.Vector2();

                // Interactive 3D Objects
                this.interactiveObjects = [];

                this.initScene();
                this.initLights();
                this.initFieldGeometry();
                this.initPaddleAndBall();
                this.initLobbyPanel(); // Moved forward in front of field!
                this.initDebugHUD();
                this.initWebXR();
                this.initEventListeners();

                // Start Render Loop
                this.renderer.setAnimationLoop((t, frame) => this.render(t, frame));
            }

            initScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0d14);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50);
                // Default position for desktop view looking towards field
                this.camera.position.set(0, 1.6, 1.2);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "highPerformance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.xr.enabled = true;
                
                this.container.appendChild(this.renderer.domElement);
            }

            initLights() {
                // Ambient Light
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);

                // Main Directional Light (Shadow Caster)
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
                dirLight.position.set(2, 4, 1);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                dirLight.shadow.camera.near = 0.5;
                dirLight.shadow.camera.far = 10;
                dirLight.shadow.camera.left = -2;
                dirLight.shadow.camera.right = 2;
                dirLight.shadow.camera.top = 4;
                dirLight.shadow.camera.bottom = 0;
                this.scene.add(dirLight);

                // Neon Field Point Lights
                const blueGlow = new THREE.PointLight(0x00f0ff, 1.2, 5);
                blueGlow.position.set(-FIELD.width / 2 - 0.2, FIELD.centerY, FIELD.zPos + 0.2);
                this.scene.add(blueGlow);

                const magentaGlow = new THREE.PointLight(0xff00a0, 1.2, 5);
                magentaGlow.position.set(FIELD.width / 2 + 0.2, FIELD.centerY, FIELD.zPos + 0.2);
                this.scene.add(magentaGlow);
            }

            initFieldGeometry() {
                this.fieldGroup = new THREE.Group();
                this.fieldGroup.position.set(0, 0, FIELD.zPos);

                // Frame Parameters
                const frameMat = new THREE.MeshStandardMaterial({
                    color: 0x1e293b,
                    metalness: 0.8,
                    roughness: 0.2
                });

                const borderGlowMat = new THREE.MeshBasicMaterial({ color: 0x00d8ff });

                // Outer Frame Borders (Left, Right, Top)
                const wallThick = 0.08;
                
                // Left Wall
                const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThick, FIELD.height, FIELD.depth), frameMat);
                leftWall.position.set(-FIELD.width / 2 - wallThick / 2, FIELD.centerY, 0);
                leftWall.castShadow = true;
                leftWall.receiveShadow = true;
                this.fieldGroup.add(leftWall);

                // Right Wall
                const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThick, FIELD.height, FIELD.depth), frameMat);
                rightWall.position.set(FIELD.width / 2 + wallThick / 2, FIELD.centerY, 0);
                rightWall.castShadow = true;
                rightWall.receiveShadow = true;
                this.fieldGroup.add(rightWall);

                // Top Wall
                const topWall = new THREE.Mesh(new THREE.BoxGeometry(FIELD.width + (wallThick * 2), wallThick, FIELD.depth), frameMat);
                topWall.position.set(0, FIELD.topY + wallThick / 2, 0);
                topWall.castShadow = true;
                topWall.receiveShadow = true;
                this.fieldGroup.add(topWall);

                // Back Wall (Translucent Grid Panel)
                const backGeo = new THREE.PlaneGeometry(FIELD.width, FIELD.height);
                const backMat = new THREE.MeshStandardMaterial({
                    color: 0x0b132b,
                    roughness: 0.5,
                    metalness: 0.1,
                    transparent: true,
                    opacity: 0.85
                });
                const backMesh = new THREE.Mesh(backGeo, backMat);
                backMesh.position.set(0, FIELD.centerY, -FIELD.depth / 2);
                backMesh.receiveShadow = true;
                this.fieldGroup.add(backMesh);

                // Decorative Back Grid Lines
                const gridHelper = new THREE.GridHelper(FIELD.height, 15, 0x00f0ff, 0x1e293b);
                gridHelper.rotation.x = Math.PI / 2;
                gridHelper.position.set(0, FIELD.centerY, -FIELD.depth / 2 + 0.01);
                this.fieldGroup.add(gridHelper);

                // Bottom Rail Graphic Indicator
                const railGeo = new THREE.CylinderGeometry(0.015, 0.015, FIELD.width);
                const railMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.9, roughness: 0.1 });
                const railMesh = new THREE.Mesh(railGeo, railMat);
                railMesh.rotation.z = Math.PI / 2;
                railMesh.position.set(0, FIELD.bottomY + 0.1, 0);
                this.fieldGroup.add(railMesh);

                this.scene.add(this.fieldGroup);

                // Group for Dynamic Bricks
                this.bricksGroup = new THREE.Group();
                this.fieldGroup.add(this.bricksGroup);
            }

            buildBrickMatrix() {
                // Clear existing
                while (this.bricksGroup.children.length > 0) {
                    const b = this.bricksGroup.children.pop();
                    b.geometry.dispose();
                    if (Array.isArray(b.material)) b.material.forEach(m => m.dispose());
                    else b.material.dispose();
                }

                const gap = 0.015;
                const totalGapsX = (BRICKS_COLS - 1) * gap;
                const brickWidth = (FIELD.width - 0.1 - totalGapsX) / BRICKS_COLS;
                const brickHeight = 0.12;

                const startX = -FIELD.width / 2 + 0.05 + (brickWidth / 2);
                const startY = FIELD.topY - 0.2;

                this.bricksRemaining = BRICKS_COLS * BRICKS_ROWS;

                for (let r = 0; r < BRICKS_ROWS; r++) {
                    const rowColor = ROW_COLORS[r % ROW_COLORS.length];
                    const mat = new THREE.MeshStandardMaterial({
                        color: rowColor,
                        metalness: 0.3,
                        roughness: 0.2,
                        emissive: rowColor,
                        emissiveIntensity: 0.25
                    });
                    const geo = new THREE.BoxGeometry(brickWidth, brickHeight, BRICK_DEPTH);

                    for (let c = 0; c < BRICKS_COLS; c++) {
                        const brick = new THREE.Mesh(geo, mat);
                        const px = startX + c * (brickWidth + gap);
                        const py = startY - r * (brickHeight + gap);
                        
                        brick.position.set(px, py, 0);
                        brick.castShadow = true;
                        brick.receiveShadow = true;
                        
                        // Metadata for collisions
                        brick.userData = {
                            isBrick: true,
                            row: r,
                            col: c,
                            width: brickWidth,
                            height: brickHeight,
                            depth: BRICK_DEPTH,
                            points: (BRICKS_ROWS - r) * 10
                        };

                        this.bricksGroup.add(brick);
                    }
                }
            }

            initPaddleAndBall() {
                // Paddle (Base size: 0.35m wide)
                this.paddleWidth = 0.38;
                this.paddleHeight = 0.06;
                this.paddleDepth = 0.12;

                const paddleGeo = new THREE.BoxGeometry(this.paddleWidth, this.paddleHeight, this.paddleDepth);
                const paddleMat = new THREE.MeshStandardMaterial({
                    color: 0x00f0ff,
                    metalness: 0.8,
                    roughness: 0.2,
                    emissive: 0x0077aa,
                    emissiveIntensity: 0.4
                });

                this.paddle = new THREE.Mesh(paddleGeo, paddleMat);
                this.paddle.castShadow = true;
                this.paddle.receiveShadow = true;
                this.resetPaddlePosition();
                this.fieldGroup.add(this.paddle);

                // Ball
                this.ballRadius = 0.045; // 9cm diameter sphere
                const ballGeo = new THREE.SphereGeometry(this.ballRadius, 32, 32);
                const ballMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0xffffff,
                    emissiveIntensity: 0.6,
                    metalness: 0.1,
                    roughness: 0.1
                });

                this.ball = new THREE.Mesh(ballGeo, ballMat);
                this.ball.castShadow = true;
                
                // Add point light inside ball for glowing trail effect
                this.ballLight = new THREE.PointLight(0x00f0ff, 1.5, 1.5);
                this.ball.add(this.ballLight);

                this.resetBall();
                this.fieldGroup.add(this.ball);
            }

            resetPaddlePosition() {
                this.paddle.position.set(0, FIELD.bottomY + 0.1, 0);
            }

            resetBall() {
                this.ball.position.set(0, FIELD.centerY - 0.3, 0);
                this.ballVelocity.set(0, 0, 0);
            }

            launchBall() {
                const angle = (Math.random() * 0.6 - 0.3) * Math.PI; // -54 to +54 deg
                const speed = this.baseBallSpeed * this.ballSpeedMultiplier;
                this.ballVelocity.set(
                    Math.sin(angle) * speed,
                    -Math.cos(angle) * speed,
                    0
                );
            }

            // --- LOBBY & TITLE PANEL ---
            initLobbyPanel() {
                this.lobbyGroup = new THREE.Group();
                
                // CRITICAL FIX: Place lobby panel in front of play area!
                // Field is at Z = -1.8m. We place Lobby at Z = -1.1m (0.7m in front of bricks!)
                this.lobbyGroup.position.set(0, 1.7, -1.1);

                // Backing Curved/Floating Canvas Panel
                const panelWidth = 1.2;
                const panelHeight = 0.85;

                // Create Canvas Texture for High Quality Logo + UI Text
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 726;
                const ctx = canvas.getContext('2d');

                // Render Graphic Logo & Interface on Texture
                this.renderLobbyCanvas(ctx, canvas.width, canvas.height);

                this.lobbyTexture = new THREE.CanvasTexture(canvas);
                const panelGeo = new THREE.PlaneGeometry(panelWidth, panelHeight);
                const panelMat = new THREE.MeshBasicMaterial({
                    map: this.lobbyTexture,
                    transparent: true,
                    side: THREE.DoubleSide
                });

                const panelMesh = new THREE.Mesh(panelGeo, panelMat);
                this.lobbyGroup.add(panelMesh);

                // Frame backing behind mesh for depth
                const frameBack = new THREE.Mesh(
                    new THREE.BoxGeometry(panelWidth + 0.04, panelHeight + 0.04, 0.02),
                    new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8, roughness: 0.2 })
                );
                frameBack.position.z = -0.015;
                this.lobbyGroup.add(frameBack);

                // Interactive 3D "START GAME" Button
                const btnGeo = new THREE.BoxGeometry(0.5, 0.12, 0.05);
                const btnMat = new THREE.MeshStandardMaterial({
                    color: 0x10b981,
                    emissive: 0x047857,
                    emissiveIntensity: 0.5,
                    metalness: 0.5,
                    roughness: 0.2
                });
                this.startButtonMesh = new THREE.Mesh(btnGeo, btnMat);
                this.startButtonMesh.position.set(0, -0.26, 0.04);
                this.startButtonMesh.userData = { isButton: true, action: 'START_GAME' };

                // Add 3D Text canvas label for Button
                const btnCanvas = document.createElement('canvas');
                btnCanvas.width = 512;
                btnCanvas.height = 128;
                const bCtx = btnCanvas.getContext('2d');
                bCtx.fillStyle = '#10b981';
                bCtx.fillRect(0, 0, 512, 128);
                bCtx.fillStyle = '#ffffff';
                bCtx.font = 'bold 44px sans-serif';
                bCtx.textAlign = 'center';
                bCtx.textBaseline = 'middle';
                bCtx.fillText('▶ INIZIA GIOCO', 256, 64);

                const btnTex = new THREE.CanvasTexture(btnCanvas);
                const btnLabel = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.48, 0.11),
                    new THREE.MeshBasicMaterial({ map: btnTex, transparent: true })
                );
                btnLabel.position.z = 0.028;
                this.startButtonMesh.add(btnLabel);

                this.lobbyGroup.add(this.startButtonMesh);
                this.interactiveObjects.push(this.startButtonMesh);

                this.scene.add(this.lobbyGroup);
            }

            renderLobbyCanvas(ctx, w, h) {
                // Background Gradient
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, 'rgba(15, 23, 42, 0.95)');
                grad.addColorStop(1, 'rgba(30, 41, 59, 0.95)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // Border Highlight
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 10;
                ctx.strokeRect(10, 10, w - 20, h - 20);

                // Simulated `logo.jpg` Image Artwork / Decorative Banner
                ctx.save();
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(40, 40, w - 80, 220);
                
                // Neon Grid Pattern in Logo Box
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
                ctx.lineWidth = 2;
                for (let x = 40; x < w - 40; x += 30) {
                    ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, 260); ctx.stroke();
                }
                for (let y = 40; y < 260; y += 30) {
                    ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(w - 40, y); ctx.stroke();
                }

                // Title Text
                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 20;
                ctx.font = '900 72px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ARKANOID 3D XR', w / 2, 130);

                ctx.fillStyle = '#e2e8f0';
                ctx.shadowBlur = 0;
                ctx.font = '600 28px sans-serif';
                ctx.fillText('RETRO VR & AR BREAKOUT EXPERIENCE', w / 2, 185);
                ctx.restore();

                // Instructions & Info
                ctx.fillStyle = '#94a3b8';
                ctx.font = '500 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Muovi il Controller Destro per spostare il Pad', w / 2, 330);
                ctx.fillText('Distruggi tutti i mattoni e non far cadere la palla', w / 2, 375);

                // Version Tag
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 30px monospace';
                ctx.fillText(`Versione Gioco: ${VERSION}`, w / 2, 450);
            }

            // --- DEBUG HUD (Positioned on Left Side) ---
            initDebugHUD() {
                this.hudGroup = new THREE.Group();
                // Placed on left side, angled 20 degrees towards the center player position
                this.hudGroup.position.set(-1.5, 1.5, -1.2);
                this.hudGroup.rotation.y = Math.PI / 8;

                const hudWidth = 0.65;
                const hudHeight = 0.9;

                // 2D Texture Canvas for HUD Display
                this.hudCanvas = document.createElement('canvas');
                this.hudCanvas.width = 512;
                this.hudCanvas.height = 712;
                this.hudCtx = this.hudCanvas.getContext('2d');

                this.hudTexture = new THREE.CanvasTexture(this.hudCanvas);
                const hudGeo = new THREE.PlaneGeometry(hudWidth, hudHeight);
                const hudMat = new THREE.MeshBasicMaterial({
                    map: this.hudTexture,
                    transparent: true,
                    side: THREE.DoubleSide
                });

                const hudMesh = new THREE.Mesh(hudGeo, hudMat);
                this.hudGroup.add(hudMesh);

                // Frame mesh
                const hudFrame = new THREE.Mesh(
                    new THREE.BoxGeometry(hudWidth + 0.02, hudHeight + 0.02, 0.01),
                    new THREE.MeshStandardMaterial({ color: 0x1e1b4b, metalness: 0.8, roughness: 0.3 })
                );
                hudFrame.position.z = -0.008;
                this.hudGroup.add(hudFrame);

                // Interactive HUD Buttons (Reset Game / Toggle Speed)
                const resetBtnGeo = new THREE.BoxGeometry(0.25, 0.07, 0.03);
                const resetBtnMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x991b1b, emissiveIntensity: 0.4 });
                const resetBtn = new THREE.Mesh(resetBtnGeo, resetBtnMat);
                resetBtn.position.set(-0.14, -0.32, 0.02);
                resetBtn.userData = { isButton: true, action: 'RESET_GAME' };

                // Label Reset
                const rCanvas = document.createElement('canvas'); rCanvas.width = 256; rCanvas.height = 64;
                const rCtx = rCanvas.getContext('2d');
                rCtx.fillStyle = '#ef4444'; rCtx.fillRect(0,0,256,64);
                rCtx.fillStyle = '#ffffff'; rCtx.font = 'bold 24px sans-serif'; rCtx.textAlign='center'; rCtx.textBaseline='middle';
                rCtx.fillText('RESET', 128, 32);
                const rMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.06), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(rCanvas) }));
                rMesh.position.z = 0.016;
                resetBtn.add(rMesh);
                this.hudGroup.add(resetBtn);
                this.interactiveObjects.push(resetBtn);

                // Speed Toggle Button
                const speedBtnMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8, emissiveIntensity: 0.4 });
                const speedBtn = new THREE.Mesh(resetBtnGeo, speedBtnMat);
                speedBtn.position.set(0.14, -0.32, 0.02);
                speedBtn.userData = { isButton: true, action: 'TOGGLE_SPEED' };

                const sCanvas = document.createElement('canvas'); sCanvas.width = 256; sCanvas.height = 64;
                const sCtx = sCanvas.getContext('2d');
                sCtx.fillStyle = '#3b82f6'; sCtx.fillRect(0,0,256,64);
                sCtx.fillStyle = '#ffffff'; sCtx.font = 'bold 22px sans-serif'; sCtx.textAlign='center'; sCtx.textBaseline='middle';
                sCtx.fillText('VELOCITÀ +', 128, 32);
                const sMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.06), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sCanvas) }));
                sMesh.position.z = 0.016;
                speedBtn.add(sMesh);
                this.hudGroup.add(speedBtn);
                this.interactiveObjects.push(speedBtn);

                this.scene.add(this.hudGroup);
                this.updateHUDCanvas();
            }

            updateHUDCanvas() {
                const ctx = this.hudCtx;
                const w = this.hudCanvas.width;
                const h = this.hudCanvas.height;

                // Background
                ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
                ctx.fillRect(0, 0, w, h);

                // Header
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 34px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('PANNELLO HUD & DEBUG', w / 2, 45);

                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(20, 60); ctx.lineTo(w - 20, 60); ctx.stroke();

                // Stats Listing
                ctx.textAlign = 'left';
                ctx.font = '26px monospace';
                
                const lines = [
                    { label: 'VERSIONE:', val: VERSION, color: '#38bdf8' },
                    { label: 'STATO:', val: this.gameState, color: '#facc15' },
                    { label: 'FPS:', val: `${this.fps}`, color: '#4ade80' },
                    { label: 'PUNTEGGIO:', val: `${this.score}`, color: '#ffffff' },
                    { label: 'VITE:', val: '❤️ '.repeat(Math.max(0, this.lives)), color: '#f43f5e' },
                    { label: 'MATTONI:', val: `${this.bricksRemaining}`, color: '#fb923c' },
                    { label: 'VELOCITÀ BALL:', val: `${this.ballSpeedMultiplier.toFixed(1)}x`, color: '#c084fc' },
                    { label: 'X PAD:', val: `${this.paddle ? this.paddle.position.x.toFixed(2) : 0.0} m`, color: '#94a3b8' }
                ];

                let y = 110;
                lines.forEach(item => {
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillText(item.label, 30, y);
                    ctx.fillStyle = item.color;
                    ctx.fillText(item.val, 260, y);
                    y += 45;
                });

                ctx.fillStyle = '#64748b';
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Tracciamento WebXR: local-floor', w / 2, 580);

                this.hudTexture.needsUpdate = true;
            }

            // --- WEBXR & CONTROLLERS ---
            initWebXR() {
                // VR Button Handler
                document.getElementById('btn-vr').addEventListener('click', () => {
                    audio.init();
                    this.requestXRSession('immersive-vr');
                });

                // AR Button Handler
                document.getElementById('btn-ar').addEventListener('click', () => {
                    audio.init();
                    this.requestXRSession('immersive-ar');
                });

                // Setup Controllers in Three.js
                this.controller1 = this.renderer.xr.getController(0);
                this.controller1.addEventListener('selectstart', (e) => this.onSelectStart(e));
                this.scene.add(this.controller1);

                this.controller2 = this.renderer.xr.getController(1);
                this.controller2.addEventListener('selectstart', (e) => this.onSelectStart(e));
                this.scene.add(this.controller2);

                // Controller Ray Laser Graphics
                const rayGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -3)]);
                const rayMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.6 });
                
                const ray1 = new THREE.Line(rayGeo, rayMat);
                this.controller1.add(ray1);
                
                const ray2 = new THREE.Line(rayGeo, rayMat);
                this.controller2.add(ray2);

                // Target Right Controller Specifically for Paddle Drive
                this.renderer.xr.addEventListener('sessionstart', () => {
                    const session = this.renderer.xr.getSession();
                    // Set WebXR reference space to local-floor as requested
                    this.renderer.xr.setReferenceSpaceType('local-floor');
                });
            }

            async requestXRSession(mode) {
                if (!navigator.xr) {
                    alert('WebXR non supportato su questo browser. Utilizza il browser di Meta Quest 3.');
                    return;
                }

                try {
                    const sessionInit = {
                        optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
                    };
                    const session = await navigator.xr.requestSession(mode, sessionInit);
                    this.renderer.xr.setSession(session);
                    
                    document.getElementById('overlay-ui').style.display = 'none';
                } catch (e) {
                    alert(`Impossibile avviare la sessione ${mode.toUpperCase()}: ${e.message}`);
                }
            }

            onSelectStart(event) {
                audio.init();
                const controller = event.target;
                this.tempMatrix.identity().extractRotation(controller.matrixWorld);

                this.raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                this.raycaster.ray.direction.set(0, 0, -1).applyMatrix4(this.tempMatrix);

                const intersects = this.raycaster.intersectObjects(this.interactiveObjects, true);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj && !obj.userData.action && obj.parent) {
                        obj = obj.parent;
                    }
                    if (obj && obj.userData.action) {
                        this.handleUIAction(obj.userData.action);
                    }
                }
            }

            handleUIAction(action) {
                if (action === 'START_GAME') {
                    this.startGame();
                } else if (action === 'RESET_GAME') {
                    this.resetToLobby();
                } else if (action === 'TOGGLE_SPEED') {
                    this.ballSpeedMultiplier = this.ballSpeedMultiplier >= 2.0 ? 1.0 : this.ballSpeedMultiplier + 0.3;
                    audio.scoreUp();
                }
            }

            initEventListeners() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                // Desktop Mouse Movement for Pad Control & Raycast
                window.addEventListener('mousemove', (e) => {
                    this.mousePosition.x = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mousePosition.y = -(e.clientY / window.innerHeight) * 2 + 1;

                    // Mouse Pad Control in Desktop Mode
                    if (!this.renderer.xr.isPresenting) {
                        const targetX = this.mousePosition.x * (FIELD.width / 2);
                        this.updatePaddlePosition(targetX);
                    }
                });

                // Desktop Mouse Click for UI
                window.addEventListener('click', () => {
                    audio.init();
                    if (!this.renderer.xr.isPresenting) {
                        this.raycaster.setFromCamera(this.mousePosition, this.camera);
                        const intersects = this.raycaster.intersectObjects(this.interactiveObjects, true);
                        if (intersects.length > 0) {
                            let obj = intersects[0].object;
                            while (obj && !obj.userData.action && obj.parent) {
                                obj = obj.parent;
                            }
                            if (obj && obj.userData.action) {
                                this.handleUIAction(obj.userData.action);
                            }
                        }
                    }
                });
            }

            // --- GAME CONTROL FLOW ---
            startGame() {
                this.gameState = 'PLAYING';
                this.score = 0;
                this.lives = 3;
                this.lobbyGroup.visible = false; // Hide Lobby Logo Panel
                this.buildBrickMatrix();
                this.resetPaddlePosition();
                this.resetBall();
                this.launchBall();
                audio.scoreUp();
            }

            resetToLobby() {
                this.gameState = 'LOBBY';
                this.lobbyGroup.visible = true; // Show Lobby Logo Panel again
                this.resetPaddlePosition();
                this.resetBall();
            }

            updatePaddlePosition(targetX) {
                // Clamp paddle inside game field boundaries
                const maxExtent = (FIELD.width / 2) - (this.paddleWidth / 2);
                this.paddle.position.x = THREE.MathUtils.clamp(targetX, -maxExtent, maxExtent);
            }

            // --- ENGINE UPDATE & PHYSICS ---
            updatePhysics(delta) {
                if (this.gameState !== 'PLAYING') return;

                // Move Ball
                this.ball.position.addScaledVector(this.ballVelocity, delta);

                const bPos = this.ball.position;
                const r = this.ballRadius;

                // 1. Boundary Collisions (Left, Right, Top)
                const minX = -FIELD.width / 2 + r;
                const maxX = FIELD.width / 2 - r;
                const maxY = FIELD.topY - r;

                if (bPos.x <= minX) {
                    bPos.x = minX;
                    this.ballVelocity.x *= -1;
                    audio.wallHit();
                } else if (bPos.x >= maxX) {
                    bPos.x = maxX;
                    this.ballVelocity.x *= -1;
                    audio.wallHit();
                }

                if (bPos.y >= maxY) {
                    bPos.y = maxY;
                    this.ballVelocity.y *= -1;
                    audio.wallHit();
                }

                // 2. Paddle Collision
                const pPos = this.paddle.position;
                const halfPWidth = this.paddleWidth / 2;
                const halfPHeight = this.paddleHeight / 2;

                if (bPos.y - r <= pPos.y + halfPHeight && 
                    bPos.y + r >= pPos.y - halfPHeight &&
                    bPos.x >= pPos.x - halfPWidth && 
                    bPos.x <= pPos.x + halfPWidth &&
                    this.ballVelocity.y < 0) {
                    
                    bPos.y = pPos.y + halfPHeight + r;
                    
                    // Angle rebound based on hit position relative to paddle center
                    const hitOffset = (bPos.x - pPos.x) / halfPWidth; // -1.0 to 1.0
                    const maxAngle = Math.PI / 3; // 60 degrees max
                    const bounceAngle = hitOffset * maxAngle;

                    const speed = this.ballVelocity.length();
                    this.ballVelocity.x = Math.sin(bounceAngle) * speed;
                    this.ballVelocity.y = Math.cos(bounceAngle) * speed;

                    audio.paddleHit();
                }

                // 3. Brick Collisions
                const bricks = this.bricksGroup.children;
                for (let i = bricks.length - 1; i >= 0; i--) {
                    const brick = bricks[i];
                    if (!brick.visible) continue;

                    const bX = brick.position.x;
                    const bY = brick.position.y;
                    const w2 = brick.userData.width / 2;
                    const h2 = brick.userData.height / 2;

                    // AABB Collision check
                    if (bPos.x + r >= bX - w2 && bPos.x - r <= bX + w2 &&
                        bPos.y + r >= bY - h2 && bPos.y - r <= bY + h2) {
                        
                        // Destroy Brick
                        this.bricksGroup.remove(brick);
                        brick.geometry.dispose();
                        brick.material.dispose();

                        this.score += brick.userData.points;
                        this.bricksRemaining--;

                        // Simple velocity reflect
                        this.ballVelocity.y *= -1;

                        audio.brickHit(brick.userData.row);

                        // Check Win Condition
                        if (this.bricksRemaining <= 0) {
                            audio.scoreUp();
                            this.buildBrickMatrix(); // Reset next level
                            this.resetBall();
                            this.launchBall();
                        }
                        break;
                    }
                }

                // 4. Ball Out Bottom (Life Lost)
                if (bPos.y < FIELD.bottomY - 0.2) {
                    this.lives--;
                    audio.gameOver();

                    if (this.lives <= 0) {
                        this.gameState = 'GAMEOVER';
                        setTimeout(() => this.resetToLobby(), 2000);
                    } else {
                        this.resetBall();
                        this.launchBall();
                    }
                }
            }

            updateXRControllers() {
                if (!this.renderer.xr.isPresenting) return;

                // Get Right Controller Position for Pad Motion
                const session = this.renderer.xr.getSession();
                if (!session) return;

                // Controller index 1 is typically Right Controller
                const rightHand = this.controller2; 
                if (rightHand) {
                    // Extract World position of controller
                    const worldPos = new THREE.Vector3();
                    rightHand.getWorldPosition(worldPos);

                    // Link Pad X to Right Controller World X
                    this.updatePaddlePosition(worldPos.x);
                }
            }

            render(time, frame) {
                // Delta time calculation
                const now = performance.now();
                const delta = Math.min((now - this.lastTime) / 1000, 0.1);
                this.lastTime = now;

                // FPS Counter Update
                this.frameCount++;
                if (this.frameCount % 30 === 0) {
                    this.fps = Math.round(1 / delta);
                    this.updateHUDCanvas();
                }

                // Handlers
                this.updateXRControllers();
                this.updatePhysics(delta);

                // Render Scene
                this.renderer.render(this.scene, this.camera);
            }
        }

        // Initialize App on DOM Ready
        window.addEventListener('DOMContentLoaded', () => {
            window.app = new ArkanoidXRApp();
        });
    </script>
</body>
</html>
